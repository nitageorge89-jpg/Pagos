<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Crys Sports · Pagos</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;background:#0d1117;font-family:'Barlow Condensed',Impact,sans-serif;color:#f0f0f0;}

/* ── HEADER ── */
header{background:linear-gradient(135deg,#1565c0,#0d47a1);padding:12px 14px 10px;border-bottom:3px solid #4fc3f7;display:flex;align-items:center;justify-content:space-between;}
.hdr-left .sub{font-size:9px;letter-spacing:4px;color:#90caf9;font-family:'Barlow',sans-serif;}
.hdr-left h1{font-size:22px;font-weight:800;letter-spacing:1px;line-height:1.1;}
.save-pill{font-size:10px;font-family:'Barlow',sans-serif;color:#66bb6a;display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .3s;background:#1a3a2a;padding:4px 9px;border-radius:12px;border:1px solid #66bb6a44;}
.save-pill.on{opacity:1;}
.save-dot{width:6px;height:6px;border-radius:50%;background:#66bb6a;}

/* ── SESSION TABS ── */
.tabs-bar{background:#161b22;border-bottom:1px solid #30363d;padding:0 12px;display:flex;align-items:center;gap:0;overflow-x:auto;scrollbar-width:none;}
.tabs-bar::-webkit-scrollbar{display:none;}
.tab-btn{flex-shrink:0;padding:10px 14px;font-size:13px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;color:#8b949e;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s;white-space:nowrap;}
.tab-btn.active{color:#4fc3f7;border-bottom-color:#4fc3f7;}
.tab-btn:hover{color:#ccc;}
.tab-add{flex-shrink:0;padding:8px 12px;font-size:18px;color:#8b949e;background:none;border:none;cursor:pointer;transition:color .15s;}
.tab-add:hover{color:#66bb6a;}

/* ── WRAP ── */
.wrap{max-width:600px;margin:0 auto;padding:14px 12px 80px;}

/* ── SCREENS ── */
.screen{display:none;}
.screen.on{display:block;}

/* ── FORMS ── */
.label{font-size:10px;color:#90caf9;margin-bottom:6px;font-family:'Barlow',sans-serif;letter-spacing:1.5px;display:block;}
textarea{width:100%;background:#161b22;border:1.5px solid #30363d;border-radius:8px;color:#e6edf3;font-size:14px;font-family:'Barlow',sans-serif;padding:10px 12px;resize:vertical;line-height:1.7;outline:none;transition:border-color .2s;}
textarea:focus{border-color:#4fc3f7;}
.btn-main{margin-top:10px;width:100%;background:#1565c0;color:#fff;font-size:16px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:2px;padding:13px;border-radius:8px;border:none;cursor:pointer;transition:background .15s;}
.btn-main:hover{background:#29b6f6;}
.btn-ghost{width:100%;background:transparent;border:1.5px solid #30363d;color:#8b949e;font-size:12px;font-family:'Barlow',sans-serif;letter-spacing:1px;padding:10px;border-radius:8px;cursor:pointer;transition:all .2s;margin-top:8px;}
.btn-ghost:hover{border-color:#8b949e;color:#ccc;}
.err{color:#f48fb1;font-family:'Barlow',sans-serif;font-size:11px;margin-top:6px;display:none;}

/* ── RESUME BANNER ── */
.resume-banner{background:#1a3a2a;border:1.5px solid #66bb6a44;border-radius:10px;padding:12px 14px;margin-bottom:12px;}
.resume-title{font-size:12px;color:#66bb6a;font-family:'Barlow',sans-serif;letter-spacing:1px;margin-bottom:5px;}
.resume-info{font-size:13px;color:#ccc;font-family:'Barlow',sans-serif;line-height:1.5;margin-bottom:10px;}
.resume-btns{display:flex;gap:8px;}
.rbtn-yes{flex:1;background:#1565c0;color:#fff;font-size:13px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;padding:9px;border-radius:7px;border:none;cursor:pointer;}
.rbtn-yes:hover{background:#29b6f6;}
.rbtn-no{flex:1;background:transparent;border:1.5px solid #30363d;color:#8b949e;font-size:12px;font-family:'Barlow',sans-serif;padding:9px;border-radius:7px;cursor:pointer;}

/* ── SETUP ── */
.setup-card{background:#161b22;border:1.5px solid #30363d;border-radius:10px;margin-bottom:10px;overflow:hidden;}
.setup-head{padding:10px 13px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.setup-name{font-size:16px;font-weight:800;letter-spacing:1px;color:#fff;}
.setup-controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
/* color */
.col-btn{width:30px;height:30px;border-radius:50%;border:2px solid #30363d;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:border-color .15s;}
.col-btn.sel{border-color:#4fc3f7;border-width:3px;}
.col-btn.w{background:#fff;color:#000;}
.col-btn.b{background:#111;color:#fff;}
/* side */
.side-btn{padding:4px 10px;border-radius:6px;border:1.5px solid #30363d;background:none;font-size:11px;font-family:'Barlow',sans-serif;font-weight:700;color:#8b949e;cursor:pointer;transition:all .15s;letter-spacing:.5px;}
.side-btn.sel-L{border-color:#4fc3f7;color:#4fc3f7;background:#4fc3f715;}
.side-btn.sel-R{border-color:#ffb74d;color:#ffb74d;background:#ffb74d15;}
.setup-chips{padding:5px 11px 9px;display:flex;flex-wrap:wrap;gap:4px;}
.chip{border-radius:16px;padding:2px 9px;font-size:11px;font-family:'Barlow',sans-serif;}

/* ── GLOBAL STATS ── */
.gstats{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.gstat{flex:1;min-width:60px;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:7px 8px;text-align:center;}
.gstat-n{font-size:20px;font-weight:800;}
.gstat-l{font-size:9px;color:#8b949e;font-family:'Barlow',sans-serif;letter-spacing:.8px;}
.prog-box{width:100%;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:8px 12px;}
.prog-top{display:flex;justify-content:space-between;margin-bottom:4px;}
.prog-top span{font-size:10px;font-family:'Barlow',sans-serif;}
.prog-track{height:5px;background:#30363d;border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;transition:width .3s;}

/* ── SUMMARY ── */
.summary-bar{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:9px 12px;margin-bottom:12px;}
.sum-sec{margin-bottom:7px;}
.sum-sec:last-child{margin-bottom:0;}
.sum-title{font-size:9px;font-family:'Barlow',sans-serif;letter-spacing:1px;margin-bottom:4px;}
.sum-names{display:flex;flex-wrap:wrap;gap:4px;}
.sum-chip{border-radius:12px;padding:2px 8px;font-size:11px;font-family:'Barlow',sans-serif;}

/* ── MATCH BLOCK (vertical) ── */
.match-block{margin-bottom:16px;border:1px solid #30363d;border-radius:12px;overflow:hidden;}
.match-hdr{background:#161b22;padding:9px 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #30363d;}
.match-hdr-title{font-size:13px;font-weight:800;color:#4fc3f7;letter-spacing:1px;}
.match-hdr-time{font-size:10px;font-family:'Barlow',sans-serif;color:#8b949e;}

/* Team block vertical */
.team-block{overflow:hidden;}
.team-block+.team-block{border-top:2px solid #0d1117;}

/* VS separator */
.vs-sep{background:#0d1117;text-align:center;padding:6px;font-size:16px;font-weight:800;color:#4fc3f7;letter-spacing:3px;}

.team-head{padding:8px 11px;display:flex;flex-direction:column;gap:4px;}
.team-title-row{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.team-name{font-size:15px;font-weight:800;letter-spacing:1px;}
.team-badge{font-size:10px;font-family:'Barlow',sans-serif;padding:2px 7px;border-radius:10px;border:1px solid;white-space:nowrap;}
.side-tag{font-size:9px;font-family:'Barlow',sans-serif;font-weight:700;padding:2px 7px;border-radius:8px;letter-spacing:.5px;}
.tag-L{background:#4fc3f715;border:1px solid #4fc3f755;color:#4fc3f7;}
.tag-R{background:#ffb74d15;border:1px solid #ffb74d55;color:#ffb74d;}

.team-acts{display:flex;gap:4px;flex-wrap:wrap;}
.tact{flex:1;min-width:0;font-size:9px;font-family:'Barlow',sans-serif;padding:3px 6px;border-radius:5px;border:1px solid;cursor:pointer;background:none;white-space:nowrap;transition:opacity .15s;}
.tact:hover{opacity:.7;}

.team-players{padding:5px 8px 8px;}

/* Player row */
.p-row{display:flex;align-items:center;gap:4px;margin-bottom:4px;}
.p-btn{display:flex;align-items:center;flex:1;padding:8px 9px;border-radius:7px;border-width:1.5px;border-style:solid;gap:7px;cursor:pointer;background:none;font-family:'Barlow',sans-serif;text-align:left;transition:transform .1s;}
.p-btn:active{transform:scale(0.98);}
.p-circle{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;font-family:'Barlow Condensed',sans-serif;}
.p-name{font-size:14px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.p-badge{font-size:16px;line-height:1;flex-shrink:0;}

/* States – dark */
.s0 .p-btn{background:#ff000015;border-color:#ef9a9a55;color:#ffcdd2;}
.s0 .p-circle{background:#c62828;color:#fff;}
.s0 .p-badge{}
.s1 .p-btn{background:#1565c018;border-color:#64b5f655;color:#e3f2fd;}
.s1 .p-circle{background:#1976d2;color:#fff;}
.s1 .p-badge{}
.s2 .p-btn{background:#1b5e2018;border-color:#66bb6a55;color:#e8f5e9;}
.s2 .p-circle{background:#2e7d32;color:#fff;}
.s2 .p-badge{}

/* States – white team */
.wt.s0 .p-btn{background:#ffebee;border-color:#ef9a9a66;color:#c62828;}
.wt.s0 .p-circle{background:#ef9a9a;color:#fff;}
.wt.s0 .p-badge{}
.wt.s1 .p-btn{background:#e3f2fd;border-color:#64b5f677;color:#1565c0;}
.wt.s1 .p-circle{background:#1976d2;color:#fff;}
.wt.s1 .p-badge{}
.wt.s2 .p-btn{background:#e8f5e9;border-color:#66bb6a66;color:#2e7d32;}
.wt.s2 .p-circle{background:#2e7d32;color:#fff;}
.wt.s2 .p-badge{}

/* Icon btns */
.icon-btn{width:28px;height:28px;border-radius:50%;background:#1e2830;border:1.5px solid #30363d;color:#8b949e;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;position:relative;}
.icon-btn:hover{background:#1565c0;border-color:#4fc3f7;color:#fff;}

/* Dropdown */
.dd{position:fixed;background:#1e2830;border:1.5px solid #4fc3f7;border-radius:8px;z-index:999;min-width:160px;box-shadow:0 8px 32px #000000cc;overflow:hidden;}
.dd-item{padding:10px 13px;font-size:13px;font-family:'Barlow',sans-serif;cursor:pointer;color:#e0e0e0;display:block;width:100%;background:none;border:none;text-align:left;transition:background .1s;}
.dd-item:hover{background:#1565c0;color:#fff;}

/* Modal */
.modal-ov{position:fixed;inset:0;background:#00000099;z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:#1e2830;border:1.5px solid #4fc3f7;border-radius:12px;padding:18px;width:100%;max-width:300px;}
.modal-title{font-size:15px;font-weight:800;color:#4fc3f7;margin-bottom:11px;letter-spacing:1px;}
.modal-input{width:100%;background:#0d1117;border:1.5px solid #30363d;border-radius:7px;color:#f0f0f0;font-size:16px;font-family:'Barlow',sans-serif;padding:10px 11px;outline:none;margin-bottom:10px;}
.modal-input:focus{border-color:#4fc3f7;}
.modal-btns{display:flex;gap:8px;}
.modal-ok{flex:1;background:#1565c0;color:#fff;font-size:14px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;padding:10px;border-radius:7px;border:none;cursor:pointer;}
.modal-ok:hover{background:#29b6f6;}
.modal-cancel{flex:1;background:transparent;border:1.5px solid #30363d;color:#8b949e;font-size:12px;font-family:'Barlow',sans-serif;padding:10px;border-radius:7px;cursor:pointer;}

/* Time input modal extras */
.modal-sub{font-size:11px;color:#8b949e;font-family:'Barlow',sans-serif;margin-bottom:8px;}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="hdr-left">
    <div class="sub">⚽ CRYSSPORTS</div>
    <h1>CONTROL DE PAGOS</h1>
  </div>
  <div class="save-pill" id="save-pill"><div class="save-dot"></div>Guardado</div>
</header>

<!-- SESSION TABS -->
<div class="tabs-bar" id="tabs-bar">
  <!-- rendered by JS -->
  <button class="tab-add" onclick="addSession()" title="Nueva sesión">＋</button>
</div>

<!-- MODAL -->
<div class="modal-ov" id="modal" style="display:none" onclick="closeModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title" id="modal-title">—</div>
    <div class="modal-sub" id="modal-sub" style="display:none"></div>
    <input class="modal-input" id="modal-input" type="text" maxlength="40"
      onkeydown="if(event.key==='Enter')modalOk()">
    <div class="modal-btns">
      <button class="modal-ok" onclick="modalOk()">GUARDAR</button>
      <button class="modal-cancel" onclick="closeModal()">CANCELAR</button>
    </div>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="modal-ov" id="confirm-modal" style="display:none" onclick="closeConfirm(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title" id="confirm-title">¿Confirmar?</div>
    <div class="modal-sub" id="confirm-msg" style="display:block;font-size:14px;color:#ccc;margin-bottom:14px;"></div>
    <div class="modal-btns">
      <button class="modal-ok" id="confirm-ok" onclick="confirmOk()">SÍ, CONFIRMAR</button>
      <button class="modal-cancel" onclick="closeConfirm()">CANCELAR</button>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- INPUT -->
  <div class="screen on" id="screen-input">
    <div id="resume-area"></div>
    <label class="label">LISTA DEL PARTIDO</label>
    <textarea id="lista" rows="13" placeholder="Lista&#10;1 pepito&#10;2 andres&#10;VS&#10;Eq rival&#10;(deja vacío si no sabes nombres)"></textarea>
    <div class="err" id="err-input">⚠️ Pon al menos 2 equipos (separados por VS).</div>
    <button class="btn-main" onclick="goSetup()">SIGUIENTE →</button>
  </div>

  <!-- SETUP -->
  <div class="screen" id="screen-setup">
    <label class="label">COLOR Y CAMPO POR EQUIPO</label>
    <div id="setup-container"></div>
    <div class="err" id="err-setup"></div>
    <button class="btn-main" onclick="goMatch()">EMPEZAR →</button>
    <button class="btn-ghost" style="border-color:#a78bfa55;color:#a78bfa;" onclick="shufflePlayers()">🔀 MEZCLAR JUGADORES AL AZAR</button>
    <button class="btn-ghost" onclick="showScreen('input')">← VOLVER</button>
  </div>

  <!-- MATCH -->
  <div class="screen" id="screen-match">
    <div class="gstats" style="flex-wrap:nowrap;">
      <div class="gstat"><div class="gstat-n" style="color:#66bb6a" id="g-paid">0</div><div class="gstat-l">PAGADOS</div></div>
      <div class="gstat"><div class="gstat-n" style="color:#64b5f6" id="g-pres">0</div><div class="gstat-l">PRESENTES</div></div>
      <div class="gstat"><div class="gstat-n" style="color:#ef5350" id="g-abs">0</div><div class="gstat-l">PENDIENTES</div></div>
      <div class="gstat"><div class="gstat-n" style="color:#fff" id="g-total">0</div><div class="gstat-l">TOTAL</div></div>
    </div>
    <div id="summary-bar" style="display:none" class="summary-bar"></div>
    <div id="matches-container"></div>
    <button class="btn-ghost" onclick="showScreen('setup')">⚙ CONFIGURAR</button>
    <button class="btn-ghost" style="margin-top:4px;border-color:#ffb74d;color:#ffb74d;" onclick="showScreen('debts')">📋 HISTORIAL DE DEUDAS</button>
    <button class="btn-ghost" style="margin-top:4px;border-color:#c62828;color:#ef9a9a;" onclick="finalizeSession()">✓ FINALIZAR SESIÓN</button>
  </div>

  <!-- DEBTS -->
  <div class="screen" id="screen-debts">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div style="font-size:18px;font-weight:800;color:#ffb74d;letter-spacing:1px;">📋 HISTORIAL DEUDAS</div>
      <button onclick="showScreen('match')" style="background:none;border:none;color:#8b949e;font-size:13px;font-family:Barlow,sans-serif;cursor:pointer;">← VOLVER</button>
    </div>
    <div id="debts-list"></div>
    <div id="debts-empty" style="text-align:center;color:#555;font-family:Barlow,sans-serif;font-size:14px;padding:30px 0;display:none;">Sin deudas registradas ✓</div>
  </div>
</div><!-- /wrap -->

<script>
// ══════════════════════════════════════════
// DATA MODEL
// sessions = [{id, label, teams, state, matches, screen, savedAt}]
// teams = [{name, color:'w'|'b', side:'L'|'R'|'', players:[{id,name}]}]
// state = {playerId: 0|1|2}
// ══════════════════════════════════════════

const SAVE_KEY = 'cryssports_v6';
let sessions = [];
let curIdx = 0;
let openDD = null;
let modalCb = null;

function session(){ return sessions[curIdx]; }
function teams(){ return session().teams; }
function st(){ return session().state; }

// ── SAVE / LOAD ──
function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({sessions, curIdx})); }catch(e){}
  flash();
}
function loadAll(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    sessions = d.sessions || [];
    curIdx = d.curIdx || 0;
    if(curIdx >= sessions.length) curIdx = 0;
    return sessions.length > 0;
  }catch(e){ return false; }
}
function flash(){
  const el = document.getElementById('save-pill');
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('on'), 2000);
}

// ── SESSIONS ──
function newSession(label){
  return { id: Date.now(), label: label||'Partido', teams:[], state:{}, matches:[], screen:'input', savedAt: new Date().toISOString() };
}

function addSession(){
  const label = fmtNow();
  openModal('NOMBRE DEL PARTIDO', label, '', name=>{
    sessions.push(newSession(name||label));
    curIdx = sessions.length-1;
    save();
    renderTabs();
    switchSession(curIdx);
  });
}

function switchSession(idx){
  curIdx = idx;
  const ses = session();
  renderTabs();
  if(ses.screen==='match'){ renderMatch(); showScreen('match'); }
  else if(ses.screen==='setup'){ renderSetup(); showScreen('setup'); }
  else { showScreen('input'); }
  save();
}

function renderTabs(){
  const bar = document.getElementById('tabs-bar');
  // remove old tabs
  bar.querySelectorAll('.tab-btn').forEach(b=>b.remove());
  const addBtn = bar.querySelector('.tab-add');
  sessions.forEach((ses,i)=>{
    const btn = document.createElement('button');
    btn.className = 'tab-btn'+(i===curIdx?' active':'');
    btn.textContent = ses.label;
    btn.onclick = ()=>switchSession(i);
    // long press to rename
    btn.addEventListener('contextmenu', e=>{ e.preventDefault(); renameSession(i); });
    bar.insertBefore(btn, addBtn);
  });
}

function renameSession(idx){
  openModal('RENOMBRAR', sessions[idx].label, '', name=>{
    if(name.trim()) sessions[idx].label = name.trim();
    save(); renderTabs();
  });
}

function finalizeSession(){
  openConfirm(
    "FINALIZAR SESION",
    "Partido: " + session().label + ". Los jugadores sin pagar se guardaran en deudas.",
    function(){
    // Auto-add unpaid (absent/present) players to debts
    const label=session().label;
    teams().forEach(t=>{
      t.players.forEach(p=>{
        if((st()[p.id]||0)<2 && p.name){
          addDebt(p.name, label);
        }
      });
    });
    sessions.splice(curIdx,1);
    if(!sessions.length){ sessions=[newSession(fmtNow())]; }
    curIdx=Math.min(curIdx,sessions.length-1);
    save();renderTabs();switchSession(curIdx);
    }
  );
}
function fmtNow(){
  const n=new Date();
  return n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0');
}

// ── SCREENS ──
function showScreen(name){
  ['input','setup','match','debts'].forEach(s=>{
    document.getElementById('screen-'+s).classList.toggle('on', s===name);
  });
  if(session() && name!=='debts') session().screen = name;
  if(name==='debts') renderDebts();
  window.scrollTo({top:0, behavior:'smooth'});
}

// ── PARSE ──
function parseInput(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const res=[]; let cur=null; let teamNum=0;

  function isJunk(line){
    if(/https?:\/\//i.test(line)) return true;
    if(/^\*.+\*$/.test(line)) return true;        // *bold* WhatsApp
    if(/^[*#_~]/.test(line)) return true;
    if(/^\d{1,2}:\d{2}/.test(line)) return true;
    if(/^[\u{1F300}-\u{1FAFF}]+$/u.test(line)) return true;
    return false;
  }

  function isTeamName(line){
    // Explicit "Equipo X" pattern
    if(/^equipo\s+/i.test(line)) return true;
    // Single word that is likely a team/person name after VS (set by caller)
    return false;
  }

  // First pass: collect all non-junk lines with their types
  const cleaned=[];
  for(const line of lines){
    if(isJunk(line)) continue;
    if(/^vs$/i.test(line)){ cleaned.push({type:'vs',line}); continue; }
    const playerMatch=line.match(/^(\d+)\s+(\S.*)$/);
    const bareNum=/^\d+[.)]?\s*$/.test(line);
    if(bareNum) continue;
    if(playerMatch) cleaned.push({type:'player',name:playerMatch[2].trim(),line});
    else cleaned.push({type:'other',line});
  }

  // Second pass: build teams
  // Rule: an "other" line becomes a team name ONLY if:
  //   1. It immediately precedes player lines (no other "other" lines between)
  //   2. OR it matches explicit team pattern
  // Otherwise ignore it
  for(let i=0;i<cleaned.length;i++){
    const item=cleaned[i];
    if(item.type==='vs'){ cur=null; continue; }
    if(item.type==='player'){
      if(!cur){
        teamNum++;
        cur={name:'Equipo '+teamNum,color:'b',side:'',players:[]};
        res.push(cur);
      }
      cur.players.push({id:uid(),name:item.name});
      continue;
    }
    if(item.type==='other'){
      // Look ahead: is the very next non-other item a player?
      let nextIsPlayer=false;
      for(let j=i+1;j<cleaned.length;j++){
        if(cleaned[j].type==='player'){ nextIsPlayer=true; break; }
        if(cleaned[j].type==='vs') break;
        if(cleaned[j].type==='other') break; // another label in between — not a team name
      }
      if(nextIsPlayer && isTeamName(item.line)){
        // Use as team name
        cur=null;
        const rawName=item.line.match(/^equipo\s+(.+)$/i)
          ?'Equipo '+item.line.match(/^equipo\s+(.+)$/i)[1]:item.line;
        cur={name:rawName,color:'b',side:'',players:[]};
        teamNum++;
        res.push(cur);
      } else {
        // Ignore — it's location/date/other info
        // But reset cur so next players start a new team
        cur=null;
      }
    }
  }
  return res.filter(t=>t.players.length>0);
}

function buildMatches(n){ const m=[]; for(let i=0;i+1<n;i+=2) m.push([i,i+1]); return m; }
function uid(){ return 'p'+Math.random().toString(36).slice(2,9); }
function cap(s){ return s?s.charAt(0).toUpperCase()+s.slice(1):'';}

// ── STYLE ──
function tsty(team){
  const w=team.color==='w';
  return {
    bg:w?'#fff':'#111', headBg:w?'#f0f0f0':'#1a1a1a', border:w?'#ccc':'#333',
    accent:w?'#1565c0':'#4fc3f7', nameColor:w?'#1565c0':'#4fc3f7',
    badgeBg:w?'#e0ecff':'#4fc3f718', badgeBorder:w?'#1565c066':'#4fc3f755',
    markBorder:w?'#1565c055':'#4fc3f744', markTxt:w?'#1565c0':'#4fc3f7',
    addBorder:w?'#66bb6a88':'#66bb6a55', addTxt:w?'#2e7d32':'#66bb6a',
    isWhite:w
  };
}

function makePlayerRow(player,num,ti,s){
  const curSt = st()[player.id]||0;
  const row=document.createElement('div');
  row.className='p-row s'+curSt+(s.isWhite?' wt':'');
  row.id='prow-'+player.id;

  // ── Info bar (long press to revert) ──
  const infoBar=document.createElement('div');
  infoBar.className='p-btn';
  infoBar.style.cssText='cursor:pointer;user-select:none;-webkit-user-select:none;';

  const circle=document.createElement('div');
  circle.className='p-circle';
  circle.style.flexShrink='0';
  circle.textContent=curSt===2?'✓':curSt===1?'●':'○';

  const nameEl=document.createElement('div');
  nameEl.className='p-name';
  nameEl.style.cssText='flex:1;min-width:0;';
  nameEl.textContent=(num+'. ')+(player.name?cap(player.name):'Plaza '+num);

  const badge=document.createElement('div');
  badge.className='p-badge';
  badge.style.flexShrink='0';
  badge.textContent=curSt===2?'':curSt===1?'✋':'⏳';

  infoBar.appendChild(circle);
  infoBar.appendChild(nameEl);
  infoBar.appendChild(badge);

  // Long press → revert to absent
  if(curSt>0){
    let lt=null;
    const startL=(e)=>{ lt=setTimeout(()=>{ lt=null; revertToAbsent(player.id,ti,player.name||'Plaza '+num,curSt); },700); };
    const cancelL=()=>{ if(lt){clearTimeout(lt);lt=null;} };
    infoBar.addEventListener('touchstart',(e)=>{ e.preventDefault(); startL(e); },{passive:false});
    infoBar.addEventListener('touchmove', cancelL,{passive:true});
    infoBar.addEventListener('touchend', cancelL);
    infoBar.addEventListener('touchcancel', cancelL);
    infoBar.addEventListener('mousedown', startL);
    infoBar.addEventListener('mousemove', cancelL);
    infoBar.addEventListener('mouseup', cancelL);
    infoBar.addEventListener('mouseleave', cancelL);
    infoBar.addEventListener('contextmenu',(e)=>e.preventDefault());
  }
  row.appendChild(infoBar);

  // ── Action buttons row ──
  const actRow=document.createElement('div');
  actRow.style.cssText='display:flex;gap:3px;margin-top:3px;align-items:center;overflow-x:auto;scrollbar-width:none;';

  const btnBase='padding:4px 0;border-radius:5px;border:1.5px solid;font-size:10px;font-weight:700;font-family:Barlow Condensed,sans-serif;background:none;cursor:pointer;flex:1;text-align:center;';

    actRow.appendChild(presBtn);

    const paidBtn=document.createElement('button');
    paidBtn.style.cssText=btnBase+'border-color:#2e7d32;color:#2e7d32;';
    paidBtn.textContent='✓ PAGADO';
    paidBtn.onclick=()=>setState(player.id,ti,2,player.name||'Plaza '+num);
    actRow.appendChild(paidBtn);

  } else if(curSt===1){
    const paidBtn=document.createElement('button');
    paidBtn.style.cssText=btnBase+'border-color:#2e7d32;color:#2e7d32;';
    paidBtn.textContent='✓ MARCAR PAGADO';
    paidBtn.onclick=()=>setState(player.id,ti,2,player.name||'Plaza '+num);
    actRow.appendChild(paidBtn);

  } else {
    const spacer=document.createElement('div');
    spacer.style.cssText='flex:1;';
    actRow.appendChild(spacer);
  }

  const iconSty='width:24px;height:24px;border-radius:5px;border:1.5px solid #2a2a2a;color:#666;font-size:10px;background:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;';

  const editBtn=document.createElement('button');
  editBtn.style.cssText=iconSty;
  editBtn.textContent='✎';editBtn.title='Editar';
  editBtn.onclick=()=>promptEdit(player.id,ti,player.name);
  actRow.appendChild(editBtn);

  const others=teams().filter((_,i)=>i!==ti);
  if(others.length>0){
    const mw=document.createElement('div');
    mw.style.cssText='position:relative;flex-shrink:0;display:flex;';
    const mb=document.createElement('button');
    mb.style.cssText=iconSty;mb.innerHTML='⇄';mb.title='Mover';
    mb.onclick=(e)=>{ e.stopPropagation(); showMoveDD(player.id,ti,others,mb); };
    mw.appendChild(mb);actRow.appendChild(mw);
  }

  const delBtn=document.createElement('button');
  delBtn.style.cssText='width:24px;height:24px;border-radius:5px;border:1.5px solid #7f1d1d;color:#ef5350;font-size:11px;font-weight:700;background:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;';
  delBtn.textContent='✕';delBtn.title='Eliminar';
  delBtn.onclick=()=>deletePlayer(player.id,ti,player.name||'Plaza '+num);
  actRow.appendChild(delBtn);

  row.appendChild(actRow);
  return row;
}

// ── ACTIONS ──
function setState(pid,ti,newSt,playerName){
  if(newSt===2){
    // PAGADO always needs confirmation
    openConfirm(
      '¿CONFIRMAR PAGO?',
      (playerName||'Este jugador')+' pasará a PAGADO.',
      ()=>{ st()[pid]=2; refreshAndSort(ti); }
    );
  } else {
    // PRESENTE — instant, no confirmation
    st()[pid]=newSt;
    refreshAndSort(ti);
  }
}
function revertToAbsent(pid,ti,playerName,curSt){
  if(curSt===0) return;
  const label=curSt===2?'PAGADO':'PRESENTE';
  if(curSt===2){
    // Was paid — needs confirmation
    openConfirm(
      '¿QUITAR PAGADO?',
      (playerName||'Este jugador')+' volverá a AUSENTE.',
      ()=>{ st()[pid]=0; refreshAndSort(ti); }
    );
  } else {
    // Was present — instant, no confirm
    st()[pid]=0;
    refreshAndSort(ti);
  }
}
function deletePlayer(pid,ti,playerName){
  openConfirm(
    '¿ELIMINAR JUGADOR?',
    'Se eliminará '+(playerName||'este jugador')+' de la lista.',
    ()=>{
      teams()[ti].players=teams()[ti].players.filter(p=>p.id!==pid);
      delete st()[pid];
      refreshAndSort(ti);updateGlobal();updateSummary();save();
    }
  );
}
function refreshAndSort(ti){
  // Sort: absent first, present middle, paid last
  teams()[ti].players.sort((a,b)=>(st()[a.id]||0)-(st()[b.id]||0));
  refreshTeamBlock(ti);updateGlobal();updateSummary();save();
}
function markAllPaid(ti,val){
  if(val){
    openConfirm(
      '¿MARCAR TODOS PAGADO?',
      'Se marcarán '+teams()[ti].players.length+' jugadores como PAGADO.',
      ()=>{
        teams()[ti].players.forEach(p=>{st()[p.id]=2;});
        refreshAndSort(ti);
      }
    );
  } else {
    teams()[ti].players.forEach(p=>{st()[p.id]=0;});
    refreshAndSort(ti);
  }
}
function promptAdd(ti){
  openModal('NUEVO JUGADOR','','Nombre (deja vacío para plaza libre)',name=>{
    const id=uid();
    teams()[ti].players.push({id, name:name.trim()});
    st()[id]=0;
    refreshTeamBlock(ti);updateGlobal();updateSummary();save();
    // scroll to that team block
    const el=document.getElementById('tblock-'+ti);
    if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
}
function promptEdit(pid,ti,current){
  openModal('EDITAR NOMBRE',current,'',name=>{
    const p=teams()[ti].players.find(x=>x.id===pid);
    if(p) p.name=name.trim();
    refreshTeamBlock(ti);save();
  });
}
function movePlayer(pid,fromTi,toTi){
  const fi=teams()[fromTi].players.findIndex(p=>p.id===pid);
  if(fi===-1)return;
  const [p]=teams()[fromTi].players.splice(fi,1);
  teams()[toTi].players.push(p);
  delete st()[p.id];
  refreshTeamBlock(fromTi);
  refreshTeamBlock(toTi);
  updateGlobal();updateSummary();save();
}

function refreshTeamBlock(ti){
  const existing=document.getElementById('tblock-'+ti);
  if(!existing)return;
  const s=tsty(teams()[ti]);
  const newBlock=buildTeamBlock(ti);
  existing.parentNode.replaceChild(newBlock,existing);
}

  const panel=document.createElement('div');

  const title=document.createElement('div');
  title.style.cssText='padding:10px 14px;font-size:11px;color:#4fc3f7;font-family:Barlow,sans-serif;letter-spacing:1px;border-bottom:1px solid #30363d;';
  title.textContent='MOVER A...';
  panel.appendChild(title);
  others.forEach(t=>{

    item.textContent='→ '+t.name;

function openConfirm(title,msg,cb){
  confirmCb=cb;
  document.getElementById('confirm-title').textContent=title;
  document.getElementById('confirm-msg').textContent=msg;
  document.getElementById('confirm-modal').style.display='flex';

function confirmOk(){

}
function closeConfirm(e){

// ── MODAL ──
function openModal(title, value, sub, cb){
  modalCb=cb;
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-input').value=value;
  const subEl=document.getElementById('modal-sub');
  if(sub){subEl.textContent=sub;subEl.style.display='block';}
  else{subEl.style.display='none';}
  document.getElementById('modal').style.display='flex';
  setTimeout(()=>document.getElementById('modal-input').select(),80);
}
function modalOk(){
  const val=document.getElementById('modal-input').value;
  document.getElementById('modal').style.display='none';
  if(modalCb){modalCb(val);modalCb=null;}
}
function closeModal(e){
  if(!e||e.target===document.getElementById('modal')){
    document.getElementById('modal').style.display='none';modalCb=null;
  }
}

// ── STATS ──
function countSt(ti,s){ return teams()[ti].players.filter(p=>st()[p.id]===s).length; }
function updateGlobal(){
  const all=teams().flatMap(t=>t.players);
  let extraPaid=0, extraTotal=0;
  teams().forEach((t,ti)=>{
    if(t.players.length===0 && (t.rivalCount||0)>0){
      extraTotal+=t.rivalCount;
      if(st()['__team_'+ti]===true) extraPaid+=t.rivalCount;
    }
  });
  const total=all.length+extraTotal;
  const paid=all.filter(p=>st()[p.id]===2).length+extraPaid;
  const pres=all.filter(p=>st()[p.id]===1).length;
  const abs=total-paid-pres;
  document.getElementById('g-paid').textContent=paid;
  document.getElementById('g-pres').textContent=pres;
  document.getElementById('g-abs').textContent=abs;
  document.getElementById('g-total').textContent=total;
}
function updateSummary(){
  const bar=document.getElementById('summary-bar');
  const pres=teams().flatMap(t=>t.players).filter(p=>st()[p.id]===1);
  // Rival teams unpaid
  const rivalPending=[];
  teams().forEach((t,ti)=>{
    if(t.players.length===0){
      const n=t.rivalCount||0;
      if(!st()['__team_'+ti] && n>0) rivalPending.push({name:t.name,count:n});
    }
  });
  if(!pres.length && !rivalPending.length){bar.style.display='none';return;}
  bar.style.display='block';bar.innerHTML='';
  // Title
  const mainTitle=document.createElement('div');
  mainTitle.style.cssText='font-size:11px;color:#ef5350;font-family:Barlow,sans-serif;letter-spacing:1px;font-weight:700;margin-bottom:8px;';
  mainTitle.textContent='⚠ PENDIENTES DE COBRO — pulsa para ir al jugador';
  bar.appendChild(mainTitle);
  if(pres.length){
    const names=document.createElement('div');names.className='sum-names';
    pres.forEach(p=>{
      const ch=document.createElement('div');ch.className='sum-chip';
      ch.style.cssText='background:#1565c030;border:1px solid #4fc3f7;color:#e0f0ff;font-weight:600;';
      ch.textContent=(p.name?cap(p.name):'Plaza')+' ✋';
      ch.onclick=()=>{
        const el=document.getElementById('prow-'+p.id);
        if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
      };
      names.appendChild(ch);
    });
    bar.appendChild(names);
  }
  if(rivalPending.length){
    const rTitle=document.createElement('div');
    rTitle.style.cssText='font-size:10px;color:#ffb74d;font-family:Barlow,sans-serif;margin-top:8px;margin-bottom:4px;';
    rTitle.textContent='EQUIPOS RIVALES SIN COBRAR';
    bar.appendChild(rTitle);
    const rNames=document.createElement('div');rNames.className='sum-names';
    rivalPending.forEach(r=>{
      const ch=document.createElement('div');ch.className='sum-chip';
      ch.style.cssText='background:#ffb74d18;border:1px solid #ffb74d55;color:#ffb74d;';
      ch.textContent=r.name+' ('+r.count+' pendientes)';
      rNames.appendChild(ch);
    });
    bar.appendChild(rNames);
  }
}

// ── SHUFFLE ──
function shufflePlayers(){
  const ts=teams();
  if(!ts.length) return;
  const sizes=ts.map(t=>t.players.length);
  const all=ts.flatMap(t=>t.players);
  // Fisher-Yates shuffle
  for(let i=all.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [all[i],all[j]]=[all[j],all[i]];
  }
  let idx=0;
  ts.forEach((t,i)=>{ t.players=all.slice(idx,idx+sizes[i]); idx+=sizes[i]; });
  // reset states
  session().state={};
  save();
  renderSetup();
}

// ── DEBTS ──
const DEBT_KEY='cryssports_debts';
function loadDebts(){ try{ return JSON.parse(localStorage.getItem(DEBT_KEY)||'[]'); }catch(e){ return []; } }
function saveDebts(d){ try{ localStorage.setItem(DEBT_KEY,JSON.stringify(d)); }catch(e){} }

function addDebt(playerName, sessionLabel, amount){
  const debts=loadDebts();
  debts.push({ id:uid(), name:playerName, session:sessionLabel, date:new Date().toLocaleDateString('es-ES'), paid:false });
  saveDebts(debts);
}

function renderDebts(){
  const debts=loadDebts();
  const list=document.getElementById('debts-list');
  const empty=document.getElementById('debts-empty');
  if(!list) return;
  list.innerHTML='';
  const pending=debts.filter(d=>!d.paid);
  const done=debts.filter(d=>d.paid);
  if(!debts.length){ empty.style.display='block'; return; }
  empty.style.display='none';
  if(pending.length){
    const t=document.createElement('div');t.style.cssText='font-size:10px;color:#ef5350;font-family:Barlow,sans-serif;letter-spacing:1px;margin-bottom:8px;';t.textContent='PENDIENTES';list.appendChild(t);
    pending.forEach(d=>list.appendChild(makeDebtRow(d)));
  }
  if(done.length){
    const t=document.createElement('div');t.style.cssText='font-size:10px;color:#66bb6a;font-family:Barlow,sans-serif;letter-spacing:1px;margin:12px 0 8px;';t.textContent='PAGADAS';list.appendChild(t);
    done.forEach(d=>list.appendChild(makeDebtRow(d)));
  }
}

function makeDebtRow(d){
  const row=document.createElement('div');
  row.style.cssText='display:flex;align-items:center;gap:8px;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px 12px;margin-bottom:6px;';
  const info=document.createElement('div');info.style.cssText='flex:1;';
  info.innerHTML='<div style="font-size:14px;font-weight:700;color:'+(d.paid?'#66bb6a':'#ef5350')+';">'+cap(d.name)+'</div>'
    +'<div style="font-size:11px;color:#8b949e;font-family:Barlow,sans-serif;">'+d.session+' · '+d.date+'</div>';
  const btn=document.createElement('button');
  btn.style.cssText='padding:5px 12px;border-radius:6px;border:1.5px solid '+(d.paid?'#30363d':'#66bb6a55')+';color:'+(d.paid?'#555':'#66bb6a')+';font-size:11px;font-family:Barlow,sans-serif;background:none;cursor:pointer;';
  btn.textContent=d.paid?'YA PAGÓ':'MARCAR PAGADO';
  btn.onclick=()=>{
    const debts=loadDebts();
    const idx=debts.findIndex(x=>x.id===d.id);
    if(idx>-1){ debts[idx].paid=true; saveDebts(debts); renderDebts(); }
  };
  const delBtn=document.createElement('button');
  delBtn.style.cssText='width:26px;height:26px;border-radius:5px;border:1.5px solid #333;color:#555;font-size:11px;background:none;cursor:pointer;';
  delBtn.textContent='✕';
  delBtn.onclick=()=>{
    const debts=loadDebts();
    saveDebts(debts.filter(x=>x.id!==d.id));
    renderDebts();
  };
  row.appendChild(info);row.appendChild(btn);row.appendChild(delBtn);
  return row;
}

// ── INIT ──
function init(){
  const loaded = loadAll();
  if(!loaded || !sessions.length){
    sessions=[newSession(fmtNow())];
    curIdx=0;
  }
  renderTabs();
  const ses=session();
  if(ses.screen==='match'){ renderMatch(); showScreen('match'); }
  else if(ses.screen==='setup'){ renderSetup(); showScreen('setup'); }
  else { showScreen('input'); }
}

init();
