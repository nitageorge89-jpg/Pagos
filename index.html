<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Crys Sports · Pagos</title>
<!-- v54 -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;background:#eef0f3;font-family:'Barlow Condensed',Impact,sans-serif;color:#f0f0f0;}

/* ── HEADER ── */
header{background:linear-gradient(135deg,#1565c0,#0d47a1);padding:12px 14px 10px;border-bottom:3px solid #4fc3f7;display:flex;align-items:center;justify-content:space-between;}
.hdr-left .sub{font-size:9px;letter-spacing:4px;color:#90caf9;font-family:'Barlow',sans-serif;}
.hdr-left h1{font-size:22px;font-weight:800;letter-spacing:1px;line-height:1.1;}
.save-pill{font-size:10px;font-family:'Barlow',sans-serif;color:#66bb6a;display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .3s;background:#1a3a2a;padding:4px 9px;border-radius:12px;border:1px solid #66bb6a44;}
.save-pill.on{opacity:1;}
.mu-pair{display:flex;align-items:center;gap:6px;margin-bottom:8px;background:#fff;border:1px solid #e0e4ea;border-radius:8px;padding:8px 10px;}
.mu-select{flex:1;background:#f8fafc;border:1.5px solid #e0e4ea;border-radius:6px;color:#1e293b;font-size:13px;font-family:'Barlow Condensed',sans-serif;font-weight:700;padding:6px 4px;outline:none;cursor:pointer;}
.mu-vs{font-size:14px;font-weight:800;color:#4fc3f7;flex-shrink:0;padding:0 2px;}
.mu-remove{width:26px;height:26px;border-radius:5px;border:1.5px solid #c62828;color:#ef5350;font-size:12px;background:none;cursor:pointer;flex-shrink:0;}
.mu-add{width:100%;margin-top:4px;padding:8px;border-radius:7px;border:1.5px solid #66bb6a55;color:#66bb6a;font-size:12px;font-family:'Barlow',sans-serif;background:none;cursor:pointer;letter-spacing:1px;}
.save-dot{width:6px;height:6px;border-radius:50%;background:#66bb6a;}

/* ── SESSION TABS ── */
.tabs-bar{background:#fff;border-bottom:1px solid #e0e4ea;padding:0 12px;display:flex;align-items:center;gap:0;overflow-x:auto;scrollbar-width:none;}
.tabs-bar::-webkit-scrollbar{display:none;}
.tab-btn{flex-shrink:0;padding:10px 14px;font-size:13px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;color:#8b949e;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s;white-space:nowrap;}
.tab-btn.active{color:#1565c0;border-bottom-color:#1565c0;}
.tab-btn:hover{color:#ccc;}
.tab-add{flex-shrink:0;padding:8px 12px;font-size:18px;color:#8b949e;background:none;border:none;cursor:pointer;transition:color .15s;}
.tab-home{flex-shrink:0;padding:8px 12px;font-size:18px;color:#1565c0;background:none;border:none;cursor:pointer;border-left:1px solid #e0e4ea;margin-left:auto;}
.tab-add:hover{color:#66bb6a;}

/* ── WRAP ── */
.wrap{max-width:600px;margin:0 auto;padding:14px 12px 80px;}

/* ── SCREENS ── */
.screen{display:none;}
.screen.on{display:block;}

/* ── FORMS ── */
.label{font-size:10px;color:#90caf9;margin-bottom:6px;font-family:'Barlow',sans-serif;letter-spacing:1.5px;display:block;}
textarea{width:100%;background:#fff;border:1.5px solid #30363d;border-radius:8px;color:#e6edf3;font-size:14px;font-family:'Barlow',sans-serif;padding:10px 12px;resize:vertical;line-height:1.7;outline:none;transition:border-color .2s;}
textarea:focus{border-color:#1565c0;}
textarea::placeholder{color:#94a3b8;}
textarea{color:#1e293b;}
.btn-main{margin-top:10px;width:100%;background:#1565c0;color:#fff;font-size:16px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:2px;padding:13px;border-radius:8px;border:none;cursor:pointer;transition:background .15s;}
.btn-main:hover{background:#29b6f6;}
.btn-ghost{width:100%;background:transparent;border:1.5px solid #30363d;color:#8b949e;font-size:12px;font-family:'Barlow',sans-serif;letter-spacing:1px;padding:10px;border-radius:8px;cursor:pointer;transition:all .2s;margin-top:8px;}
.btn-ghost:hover{border-color:#8b949e;color:#ccc;}
.err{color:#f48fb1;font-family:'Barlow',sans-serif;font-size:11px;margin-top:6px;display:none;}

/* ── RESUME BANNER ── */
.resume-banner{background:#1a3a2a;border:1.5px solid #66bb6a44;border-radius:10px;padding:12px 14px;margin-bottom:12px;}
.resume-title{font-size:12px;color:#66bb6a;font-family:'Barlow',sans-serif;letter-spacing:1px;margin-bottom:5px;}
.resume-info{font-size:13px;color:#ccc;font-family:'Barlow',sans-serif;line-height:1.5;margin-bottom:10px;}
.resume-btns{display:flex;gap:8px;}
.rbtn-yes{flex:1;background:#1565c0;color:#fff;font-size:13px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;padding:9px;border-radius:7px;border:none;cursor:pointer;}
.rbtn-yes:hover{background:#29b6f6;}
.rbtn-no{flex:1;background:transparent;border:1.5px solid #30363d;color:#8b949e;font-size:12px;font-family:'Barlow',sans-serif;padding:9px;border-radius:7px;cursor:pointer;}

/* ── SETUP ── */
.setup-card{background:#fff;border:1.5px solid #e0e4ea;border-radius:10px;margin-bottom:10px;overflow:hidden;}
.setup-head{padding:10px 13px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.setup-name{font-size:16px;font-weight:800;letter-spacing:1px;color:#1e293b;}
.setup-controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
/* color */
.col-btn{padding:5px 12px;border-radius:6px;border:2px solid #cbd5e1;cursor:pointer;font-size:12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;transition:all .15s;letter-spacing:.5px;}
.col-btn.sel{border-width:3px;outline:2px solid #4fc3f7;outline-offset:1px;}
.col-btn.w{background:#fff;color:#000;}
.col-btn.b{background:#111;color:#fff;}
/* side */
.side-btn{padding:3px 8px;border-radius:5px;border:1px solid #cbd5e1;background:none;font-size:11px;font-family:'Barlow Condensed',sans-serif;font-weight:700;color:#64748b;cursor:pointer;transition:all .15s;letter-spacing:.3px;}
.side-btn.sel-L{border-color:#1565c0;color:#1565c0;background:#dbeafe;}
.side-btn.sel-R{border-color:#ea580c;color:#ea580c;background:#ffedd5;}
.setup-chips{padding:5px 11px 9px;display:flex;flex-wrap:wrap;gap:4px;}
.chip{border-radius:16px;padding:2px 9px;font-size:11px;font-family:'Barlow',sans-serif;}

/* ── GLOBAL STATS ── */
.gstats{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.gstat{flex:1;min-width:60px;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:7px 8px;text-align:center;}
.gstat-n{font-size:20px;font-weight:800;color:#1e293b;}
.gstat-l{font-size:9px;color:#334155;font-weight:600;font-family:'Barlow',sans-serif;letter-spacing:.8px;}
.prog-box{width:100%;background:#fff;border:1px solid #e0e4ea;border-radius:8px;padding:8px 12px;}
.prog-top{display:flex;justify-content:space-between;margin-bottom:4px;}
.prog-top span{font-size:10px;font-family:'Barlow',sans-serif;}
.prog-track{height:5px;background:#30363d;border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;transition:width .3s;}

/* ── SUMMARY ── */
.summary-bar{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:9px 12px;margin-bottom:12px;}
.sum-sec{margin-bottom:7px;}
.sum-sec:last-child{margin-bottom:0;}
.sum-title{font-size:9px;font-family:'Barlow',sans-serif;letter-spacing:1px;margin-bottom:4px;}
.sum-names{display:flex;flex-wrap:wrap;gap:4px;}
.sum-chip{border-radius:12px;padding:2px 8px;font-size:11px;font-family:'Barlow',sans-serif;}

/* ── MATCH BLOCK (vertical) ── */
.match-block{margin-bottom:16px;border:1px solid #e0e4ea;border-radius:12px;overflow:hidden;}
.match-hdr{background:#f1f5f9;padding:9px 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e0e4ea;}
.match-hdr-title{font-size:13px;font-weight:800;color:#1565c0;letter-spacing:1px;}
.match-hdr-time{font-size:10px;font-family:'Barlow',sans-serif;color:#475569;}

/* Team block vertical */
.team-block{overflow:hidden;}
.team-block+.team-block{border-top:2px solid #0d1117;}

/* VS separator */
.vs-sep{background:#e8edf2;text-align:center;padding:6px;font-size:16px;font-weight:800;color:#1565c0;letter-spacing:3px;}

.team-head{padding:8px 11px;display:flex;flex-direction:column;gap:4px;}
.team-title-row{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.team-name{font-size:15px;font-weight:800;letter-spacing:1px;}
.team-badge{font-size:10px;font-family:'Barlow',sans-serif;padding:2px 7px;border-radius:10px;border:1px solid;white-space:nowrap;}
.side-tag{font-size:9px;font-family:'Barlow',sans-serif;font-weight:700;padding:2px 7px;border-radius:8px;letter-spacing:.5px;}
.tag-L{background:#4fc3f715;border:1px solid #4fc3f755;color:#4fc3f7;}
.tag-R{background:#ffb74d15;border:1px solid #ffb74d55;color:#ffb74d;}

.team-acts{display:flex;gap:4px;flex-wrap:wrap;}
.tact{flex:1;min-width:0;font-size:9px;font-family:'Barlow',sans-serif;padding:3px 6px;border-radius:5px;border:1px solid;cursor:pointer;background:none;white-space:nowrap;transition:opacity .15s;}
.tact:hover{opacity:.7;}

.team-players{padding:5px 8px 8px;}

/* Player row */
.p-row{display:flex;align-items:center;gap:4px;margin-bottom:4px;}
.p-btn{display:flex;align-items:center;flex:1;padding:8px 9px;border-radius:7px;border-width:1.5px;border-style:solid;gap:7px;cursor:pointer;background:none;font-family:'Barlow',sans-serif;text-align:left;transition:transform .1s;}
.p-btn:active{transform:scale(0.98);}
.p-circle{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;font-family:'Barlow Condensed',sans-serif;}
.p-name{font-size:15px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.p-badge{font-size:16px;line-height:1;flex-shrink:0;}

/* States – dark */
.s0 .p-btn{background:#ff000015;border-color:#ef9a9a55;color:#ffcdd2;}
.s0 .p-circle{background:#c62828;color:#fff;}
.s0 .p-badge{}
.s1 .p-btn{background:#1565c018;border-color:#64b5f655;color:#e3f2fd;}
.s1 .p-circle{background:#1976d2;color:#fff;}
.s1 .p-badge{}
.s2 .p-btn{background:#1b5e2018;border-color:#66bb6a55;color:#e8f5e9;}
.sfree .p-btn{background:#7c3aed18;border-color:#7c3aed55;color:#ede9fe;}
.sfree .p-circle{background:#7c3aed;color:#fff;}
.shot .p-btn{background:#ff6d0018;border-color:#ff6d0055;color:#fff3e0;}
.shot .p-circle{background:#ff6d00;color:#fff;}
.wt.shot .p-btn{background:#fff3e0;border-color:#ff6d0066;color:#bf360c;}
.wt.shot .p-circle{background:#ff6d00;color:#fff;}
.wt.sfree .p-btn{background:#ede9fe;border-color:#7c3aed88;color:#3b0764;}
.wt.sfree .p-circle{background:#7c3aed;color:#fff;}
.wt.sfree .p-name{color:#3b0764 !important;font-weight:700;}
.s2 .p-circle{background:#2e7d32;color:#fff;}
.s2 .p-badge{}

/* States – white team */
.wt.s0 .p-btn{background:#ffebee;border-color:#ef9a9a66;color:#c62828;}
.wt.s0 .p-circle{background:#ef9a9a;color:#fff;}
.wt.s0 .p-badge{}
.wt.s1 .p-btn{background:#e3f2fd;border-color:#64b5f677;color:#1565c0;}
.wt.s1 .p-circle{background:#1976d2;color:#fff;}
.wt.s1 .p-badge{}
.wt.s2 .p-btn{background:#e8f5e9;border-color:#66bb6a66;color:#2e7d32;}
.wt.s2 .p-circle{background:#2e7d32;color:#fff;}
.wt.s2 .p-badge{}

/* Icon btns */
.icon-btn{width:28px;height:28px;border-radius:50%;background:#fff;border:1.5px solid #30363d;color:#8b949e;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;position:relative;}
.icon-btn:hover{background:#1565c0;border-color:#4fc3f7;color:#fff;}

/* Dropdown */
.dd{position:fixed;background:#fff;border:1.5px solid #93c5fd;border-radius:8px;z-index:999;min-width:160px;box-shadow:0 8px 32px #000000cc;overflow:hidden;}
.dd-item{padding:10px 13px;font-size:13px;font-family:'Barlow',sans-serif;cursor:pointer;color:#1e293b;display:block;width:100%;background:none;border:none;text-align:left;transition:background .1s;}
.dd-item:hover{background:#1565c0;color:#fff;}

/* Modal */
.modal-ov{position:fixed;inset:0;background:#00000099;z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:#fff;border:1.5px solid #93c5fd;border-radius:12px;padding:18px;width:100%;max-width:300px;}
.modal-title{font-size:15px;font-weight:800;color:#4fc3f7;margin-bottom:11px;letter-spacing:1px;}
.modal-input{width:100%;background:#f8fafc;border:1.5px solid #e0e4ea;border-radius:7px;color:#1e293b;font-size:16px;font-family:'Barlow',sans-serif;padding:10px 11px;outline:none;margin-bottom:10px;}
.modal-input:focus{border-color:#4fc3f7;}
.modal-btns{display:flex;gap:8px;}
.modal-ok{flex:1;background:#1565c0;color:#fff;font-size:14px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;padding:10px;border-radius:7px;border:none;cursor:pointer;}
.modal-ok:hover{background:#29b6f6;}
.modal-cancel{flex:1;background:transparent;border:1.5px solid #30363d;color:#8b949e;font-size:12px;font-family:'Barlow',sans-serif;padding:10px;border-radius:7px;cursor:pointer;}

/* Time input modal extras */
.modal-sub{font-size:11px;color:#8b949e;font-family:'Barlow',sans-serif;margin-bottom:8px;}
</style>
</head>
<body>

<!-- HEADER -->
<header style="justify-content:center;position:relative;padding:14px 20px;">
  <div style="text-align:center;">
    <div style="font-size:24px;font-weight:800;letter-spacing:3px;color:#fff;">⚽ CRYS SPORTS</div>
  </div>
  <div class="save-pill" id="save-pill" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);"><div class="save-dot"></div>Guardado</div>
</header>

<!-- SESSION TABS -->
<div class="tabs-bar" id="tabs-bar">
  <!-- rendered by JS -->
  <button class="tab-add" onclick="addSession()" title="Nueva sesión">＋</button>
  <button class="tab-home" onclick="showScreen('home')" title="Menú principal">🏠</button>
  <button class="tab-home" onclick="showScreen('debts')" title="Deudas" style="font-size:16px;">📋</button>
</div>

<!-- MODAL -->
<div class="modal-ov" id="modal" style="display:none" onclick="closeModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title" id="modal-title">—</div>
    <div class="modal-sub" id="modal-sub" style="display:none;color:#374151;"></div>
    <input class="modal-input" id="modal-input" type="text" maxlength="40"
      onkeydown="if(event.key==='Enter')modalOk()">
    <div class="modal-btns">
      <button class="modal-ok" onclick="modalOk()">GUARDAR</button>
      <button class="modal-cancel" onclick="closeModal()">CANCELAR</button>
    </div>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="modal-ov" id="confirm-modal" style="display:none" onclick="closeConfirm(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title" id="confirm-title">¿Confirmar?</div>
    <div class="modal-sub" id="confirm-msg" style="display:block;font-size:14px;color:#374151;margin-bottom:14px;"></div>
    <div class="modal-btns" id="confirm-btns">
      <button class="modal-ok" id="confirm-ok" onclick="confirmOk()">SÍ, CONFIRMAR</button>
      <button class="modal-cancel" onclick="closeConfirm()">CANCELAR</button>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- INPUT -->
  <div class="screen on" id="screen-input">
    <div id="resume-area"></div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button onclick="showScreen('debts')" style="flex:1;padding:9px;background:none;border:1.5px solid #ffb74d55;color:#ffb74d;border-radius:8px;font-size:12px;font-family:Barlow,sans-serif;cursor:pointer;">📋 DEUDAS</button>
    </div>
    <label class="label">LISTA DEL PARTIDO</label>
    <textarea id="lista" rows="13" placeholder="Lista&#10;1 pepito&#10;2 andres&#10;VS&#10;Eq rival&#10;(deja vacío si no sabes nombres)" oninput="detectSessionInfo(this.value)"></textarea>
  <div id="detected-info" style="display:none;font-size:11px;color:#1565c0;font-family:Barlow,sans-serif;margin-top:5px;padding:5px 10px;background:#dbeafe;border-radius:6px;"></div>
    <div class="err" id="err-input">⚠️ Pon al menos 2 equipos (separados por VS).</div>
    <button class="btn-main" onclick="goSetup()">SIGUIENTE →</button>
  <button class="btn-ghost" style="margin-top:6px;border-color:#a78bfa55;color:#a78bfa;" onclick="createMultipleSessions()">📅 CREAR MÚLTIPLES HORARIOS</button>
  </div>

  <!-- SETUP -->
  <div class="screen" id="screen-setup">
    <label class="label">COLOR Y CAMPO POR EQUIPO</label>
  <div id="campo-display" style="display:none;background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:8px 14px;margin-bottom:10px;font-size:13px;color:#15803d;font-family:Barlow,sans-serif;">
    📍 <span id="campo-name"></span>
    <button onclick="editCampo()" style="background:none;border:none;color:#15803d;font-size:11px;cursor:pointer;margin-left:6px;">✎ editar</button>
  </div>
  <button onclick="editCampo()" id="add-campo-btn" style="width:100%;margin-bottom:10px;padding:7px;background:none;border:1.5px solid #86efac44;color:#15803d;border-radius:7px;font-size:11px;font-family:Barlow,sans-serif;cursor:pointer;">📍 AÑADIR CAMPO</button>
    <div id="setup-container"></div>
    <div style="margin-top:14px;">
      <label class="label">PRECIO POR JUGADOR</label>
      <div style="display:flex;gap:8px;">
        <div style="flex:1;background:#fff;border:1.5px solid #2d3548;border-radius:8px;padding:8px 12px;">
          <div style="font-size:10px;color:#8b949e;font-family:Barlow,sans-serif;margin-bottom:4px;">💰 PRECIO BASE</div>
          <input id="price-base" type="number" min="0" max="99" step="0.5" placeholder="5"
            style="width:100%;background:none;border:none;color:#66bb6a;font-size:22px;font-weight:800;font-family:Barlow Condensed,sans-serif;outline:none;"
            onchange="session().priceBase=parseFloat(this.value)||0;save();">
        </div>
        <div style="flex:1;background:#fff;border:1.5px solid #2d3548;border-radius:8px;padding:8px 12px;">
          <div style="font-size:10px;color:#8b949e;font-family:Barlow,sans-serif;margin-bottom:4px;">🔥 PRECIO OFERTA</div>
          <input id="price-hot" type="number" min="0" max="99" step="0.5" placeholder="3"
            style="width:100%;background:none;border:none;color:#ffb74d;font-size:22px;font-weight:800;font-family:Barlow Condensed,sans-serif;outline:none;"
            onchange="session().priceHot=parseFloat(this.value)||0;save();">
        </div>
      </div>
    </div>
    <div id="matchup-section" style="display:none;margin-top:14px;">
      <label class="label">QUIÉN JUEGA CONTRA QUIÉN</label>
      <div id="matchup-builder"></div>
    </div>
    <div class="err" id="err-setup"></div>
    <button class="btn-main" onclick="goMatch()">EMPEZAR →</button>
    <button class="btn-ghost" style="border-color:#a78bfa55;color:#a78bfa;" onclick="shufflePlayers()">🔀 MEZCLAR JUGADORES AL AZAR</button>
    <button class="btn-ghost" onclick="backToInput()">← VOLVER</button>
  </div>

  <!-- MATCH -->
  <div class="screen" id="screen-match">
    <div class="gstats" style="flex-wrap:nowrap;">
      <div class="gstat"><div class="gstat-n" style="color:#66bb6a" id="g-paid">0</div><div class="gstat-l">PAGADOS</div></div>
      <div class="gstat"><div class="gstat-n" style="color:#a78bfa" id="g-free">0</div><div class="gstat-l">GRATIS</div></div>
      <div class="gstat"><div class="gstat-n" style="color:#ef5350" id="g-abs">0</div><div class="gstat-l">PENDIENTES</div></div>
      <div class="gstat"><div class="gstat-n" style="color:#fff" id="g-total">0</div><div class="gstat-l">TOTAL</div></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:flex-end;margin-bottom:6px;">
    <button onclick="toggleRevenue()" style="background:none;border:none;color:#555;font-size:12px;font-family:Barlow,sans-serif;cursor:pointer;display:flex;align-items:center;gap:4px;" id="revenue-toggle-btn">
      <span id="revenue-eye">👁</span> <span style="font-size:10px;letter-spacing:1px;">INGRESO</span>
    </button>
  </div>

<script>
// ══════════════════════════════════════════
// DATA MODEL
// sessions = [{id, label, teams, state, matches, screen, savedAt}]
// teams = [{name, color:'w'|'b', side:'L'|'R'|'', players:[{id,name}]}]
// state = {playerId: 0|1|2}
// ══════════════════════════════════════════

const SAVE_KEY = 'cryssports_v6';
let sessions = [];
let curIdx = 0;
let openDD = null;
let modalCb = null;

function session(){ return sessions[curIdx]; }
function teams(){ return session().teams; }
function st(){ return session().state; }

// ── SAVE / LOAD ──
function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({sessions, curIdx})); }catch(e){}
  flash();
}
function loadAll(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    sessions = d.sessions || [];
    curIdx = d.curIdx || 0;
    if(curIdx >= sessions.length) curIdx = 0;
    return sessions.length > 0;
  }catch(e){ return false; }
}
function flash(){
  const el = document.getElementById('save-pill');
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('on'), 2000);
}

// ── SESSIONS ──
function newSession(label){
  const now=new Date();
  return {
    id: Date.now(),
    label: label||'Partido',
    teams:[], state:{}, matches:[],
    screen:'input',
    savedAt: now.toISOString(),
    createdDate: now.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})
  };
}

function addSession(){
  const now=new Date();
  const todayStr=now.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  openModal('FECHA Y HORA', fmtNow(), 'Ej: Sábado 18:00  o  14/06 19:00  o  solo 18:00', name=>{
    const label=(name||fmtNow()).trim();
    const parsed=parseLabelDate(label, now);
    const fullLabel=labelWithDay(label, parsed.dateObj);
    const ses=newSession(fullLabel);
    ses.createdDate=parsed.dateLabel;
    ses.savedAt=parsed.dateObj.toISOString();
    sessions.push(ses);
    sortSessionsByTime();
    curIdx=sessions.findIndex(s=>s.label===label&&!s.closed);
    if(curIdx<0) curIdx=sessions.length-1;
    save(); renderTabs(); switchSession(curIdx);
  });
}

function parseLabelDate(label, fallback){
  if(!label) return {dateObj:fallback, dateLabel:fallback.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})};
  const now=new Date();
  const yr=now.getFullYear();

  const MONTH_MAP={'enero':0,'febrero':1,'marzo':2,'abril':3,'mayo':4,'junio':5,
    'julio':6,'agosto':7,'septiembre':8,'octubre':9,'noviembre':10,'diciembre':11};

  // Helper: normalize accents
  const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

  // Pattern 1: DD/MM HH:MM or DD/MM
  const p1=label.match(/(\d{1,2})\/(\d{1,2})(?:[\s,]+(\d{1,2}:\d{2}))?/);
  if(p1){
    const d=parseInt(p1[1]),m=parseInt(p1[2])-1;
    const dateObj=new Date(yr,m,d,12,0,0);
    const dateLabel=dateObj.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    return {dateObj,dateLabel};
  }

  // Pattern 2: Day DD Month HH:MM  e.g. "Sábado 13 junio 20:45" or "Sábado 13 20:45"
  const p2=label.match(/([a-záéíóúüñ]+)[\s,]+(\d{1,2})(?:[\s,]+([a-záéíóúüñ]+))?(?:[\s,]+(\d{1,2}:\d{2}))?/i);
  if(p2){
    const dayOrMonth=norm(p2[1]);
    const num=parseInt(p2[2]);
    const maybeMonth=p2[3]?norm(p2[3]):null;
    const dayInDayMap=DAY_MAP[dayOrMonth]!==undefined;

    if(dayInDayMap && num>=1 && num<=31){
      // dayName + day number
      const monthIdx=maybeMonth&&MONTH_MAP[maybeMonth]!==undefined?MONTH_MAP[maybeMonth]:now.getMonth();
      const dateObj=new Date(yr,monthIdx,num,12,0,0);
      const dateLabel=dateObj.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
      return {dateObj,dateLabel};
    }
  }

  // Pattern 3: just day name + time "Sábado 20:45"
  const p3=label.match(/([a-záéíóúüñ]+)[\s,]+(\d{1,2}:\d{2})/i);
  if(p3){
    const dayName=norm(p3[1]);
    const dayIdx=DAY_MAP[dayName];
    if(dayIdx!==undefined){
      let daysAhead=dayIdx-now.getDay();
      if(daysAhead<0) daysAhead+=7; // past day this week → next week
      // If today is that day, use today (not next week)
      const target=new Date(now);
      target.setDate(now.getDate()+daysAhead);
      target.setHours(12,0,0,0);
      const dateLabel=target.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
      return {dateObj:target,dateLabel};
    }
  }

  // Fallback: today
  const dateLabel=fallback.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  return {dateObj:fallback,dateLabel};
}

function labelWithDay(label, dateObj){
  if(!label) return label;
  // If label is just a time (HH:MM), prepend the day name
  if(/^\d{1,2}:\d{2}$/.test(label.trim())){
    const dayName=dateObj.toLocaleDateString('es-ES',{weekday:'long'});
    return dayName.charAt(0).toUpperCase()+dayName.slice(1)+' '+label.trim();
  }
  return label;
}
function sortSessionsByTime(){
  sessions.sort((a,b)=>{
    const getTime=s=>{
      if(!s||!s.label) return 0;
      const m=s.label.match(/(\d{1,2}):(\d{2})/);
      return m?parseInt(m[1])*60+parseInt(m[2]):0;
    };
    return getTime(a.label)-getTime(b.label);
  });
}

function switchSession(idx){
  curIdx = idx;
  const ses = session();
  renderTabs();
  if(ses.screen==='match'){ renderMatch(); showScreen('match'); }
  else if(ses.closed){ renderMatch(); showScreen('match'); }
  else if(ses.teams&&ses.teams.length>0){ renderSetup(); showScreen('setup'); }
  else {
    if(ses.rawList) document.getElementById('lista').value=ses.rawList;
    showScreen('input');
  }
  save();
}

function renderTabs(){
  const bar = document.getElementById('tabs-bar');
  // remove old tabs
  bar.querySelectorAll('.tab-btn').forEach(b=>b.remove());
  const addBtn = bar.querySelector('.tab-add');
  const today=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  sessions.forEach((ses,i)=>{
    if(ses.closed) return;
    // Only show today's sessions in tabs (or current session always visible)
    const sesDay=ses.createdDate||today;
    if(sesDay!==today && i!==curIdx) return;
    const btn = document.createElement('button');
    btn.className = 'tab-btn'+(i===curIdx?' active':'');
    btn.textContent = ses.label||'Partido';
    btn.onclick = ()=>switchSession(i);
    btn.addEventListener('contextmenu', e=>{ e.preventDefault(); renameSession(i); });
    bar.insertBefore(btn, addBtn);
  });
}

function renameSession(idx){
  openModal('RENOMBRAR', sessions[idx].label, '', name=>{
    if(name.trim()) sessions[idx].label = name.trim();
    save(); renderTabs();
  });
}

function deleteSession(){
  openConfirm(
    "ELIMINAR PARTIDO",
    session().label+" — se eliminará sin guardar deudas.",
    ()=>{
      sessions.splice(curIdx,1);
      if(!sessions.length){ sessions=[newSession(fmtNow())]; }
      curIdx=Math.min(curIdx,sessions.length-1);
      save();renderTabs();switchSession(curIdx);
    }
  );
}
function deleteSessionFromHome(idx){
  openConfirm("ELIMINAR","Eliminar partido: "+sessions[idx].label+"?",()=>{
    sessions.splice(idx,1);
    if(!sessions.length){ sessions=[newSession(fmtNow())]; curIdx=0; }
    else curIdx=Math.min(curIdx,sessions.length-1);
    save();renderTabs();renderHome();
  });
}
let selectMode=false;
let selectedClosed=new Set();

function toggleSelectClosed(){
  selectMode=!selectMode;
  selectedClosed.clear();
  const btn=document.getElementById('select-closed-btn');
  const actions=document.getElementById('select-actions');
  if(btn) btn.textContent=selectMode?'✕ CANCELAR':'✓ SELECCIONAR';
  if(btn) btn.style.borderColor=selectMode?'#ef4444':'#e0e4ea';
  if(btn) btn.style.color=selectMode?'#ef4444':'#64748b';
  if(actions) actions.style.display=selectMode?'flex':'none';
  renderHome();
}

function deleteSelectedClosed(){
  if(!selectedClosed.size) return;
  openConfirm('ELIMINAR SELECCIONADOS','Eliminar '+selectedClosed.size+' partido(s) cerrado(s)?',()=>{
    sessions=sessions.filter((_,i)=>!selectedClosed.has(i));
    selectedClosed.clear();
    selectMode=false;
    if(!sessions.length){ sessions=[newSession(fmtNow())]; }
    curIdx=Math.min(curIdx,sessions.length-1);
    save();renderTabs();renderHome();
  });
}

function clearAllClosed(){
  openConfirm("ELIMINAR CERRADOS","Eliminar todos los partidos cerrados?",()=>{
    const active=sessions.filter(s=>!s.closed);
    sessions=active.length?active:[newSession(fmtNow())];
    curIdx=0;save();renderTabs();renderHome();
  });
}
function finalizeSession(){
  // Collect unpaid for message
  const unpaidNames=[];
  teams().forEach(t=>{ t.players.forEach(p=>{ if((st()[p.id]||0)<2 && p.name) unpaidNames.push(cap(p.name)); }); });
  const debtMsg=unpaidNames.length>0?(' Deudas: '+unpaidNames.join(', ')):'';
  openConfirm(
    'FINALIZAR PARTIDO',
    session().label+debtMsg,
    ()=>{
      const label=session().label;
      // Calc revenue
      const all=teams().flatMap(t=>t.players);
      const base=session().priceBase||5;
      const hotP=session().priceHot||3;
      const paidBase=all.filter(p=>st()[p.id]===2).length;
      const paidHot=all.filter(p=>st()[p.id]===4).length;
      // Also count rival team bulk payments
      let rivalPaid=0;
      teams().forEach((t,ti)=>{
        if(t.players.length===0 && st()['__team_'+ti]) rivalPaid+=(t.rivalCount||0);
        if(t.players.length>0 && (t.rivalCount||0)>0 && st()['__rival_rem_'+ti]) rivalPaid+=(t.rivalCount||0)-t.players.length;
      });
      const rev=paidBase*base+paidHot*hotP+rivalPaid*base;
      // Add debts
      unpaidNames.forEach(name=>addDebt(name,label));
      // Mark closed — DO NOT delete
      session().closed=true;
      session().revenue=rev;
      session().closedAt=new Date().toISOString();
      session().screen='closed';
      save();
      // Go to another active session or create new
      const activeIdx=sessions.findIndex((s,i)=>!s.closed&&i!==curIdx);
      if(activeIdx>=0){ curIdx=activeIdx; }
      else { sessions.push(newSession(fmtNow())); curIdx=sessions.length-1; }
      renderTabs(); switchSession(curIdx);
    }
  );
}
function fmtNow(){
  const n=new Date();
  return n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0');
}

// ── SCREENS ──
function showScreen(name){
  ['input','setup','match','debts','home'].forEach(s=>{
    document.getElementById('screen-'+s).classList.toggle('on', s===name);
  });
  if(session() && name!=='debts' && name!=='home') session().screen = name;
  if(name==='input'){
    // Always restore raw list if session has one
    const raw=session()&&session().rawList;
    const lista=document.getElementById('lista');
    if(lista && raw) lista.value=raw;
  }
  if(name==='home'){ sortSessionsByTime(); renderTabs(); renderHome(); }
  if(name==='debts'){
    renderDebts();
    const bb=document.getElementById('debts-back-btn');
    if(bb){
      const prev=session()&&session().screen==='match'?'match':'input';
      bb.onclick=()=>showScreen(prev);
    }
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

// ── PARSE ──
function parseInput(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const res=[]; let cur=null; let teamNum=0;

  function isJunk(line){
    if(/https?:\/\//i.test(line)) return true;
    if(/^\*.+\*$/.test(line)) return true;
    if(/^[*#_~]/.test(line)) return true;
    if(/^\d{1,2}:\d{2}/.test(line)) return true;
    if(/^[\u{1F300}-\u{1FAFF}]+$/u.test(line)) return true;
    if(/^campo[:\s]/i.test(line)) return true;  // Field name
    if(/^reserva$/i.test(line)) return true;      // "Reserva" alone
    return false;
  }

  function isExplicitTeam(line){
    return /^eq\w*\s+/i.test(line);
  }

  // First pass: clean lines
  const cleaned=[];
  for(const line of lines){
    if(isJunk(line)) continue;
    if(/^vs$/i.test(line)){ cleaned.push({type:'vs',line}); continue; }
    const playerMatch=line.match(/^(\d+)\s+(\S.*)$/);
    const bareNum=/^\d+[.)]?\s*$/.test(line);
    if(bareNum) continue;
    if(playerMatch) cleaned.push({type:'player',name:playerMatch[2].trim(),line});
    else cleaned.push({type:'other',line});
  }

  // Second pass: build teams
  for(let i=0;i<cleaned.length;i++){
    const item=cleaned[i];

    if(item.type==='vs'){ cur=null; continue; }

    if(item.type==='player'){
      if(!cur){
        teamNum++;
        cur={name:'Equipo '+teamNum,color:'b',side:'',players:[]};
        res.push(cur);
      }
      cur.players.push({id:uid(),name:item.name});
      continue;
    }

    if(item.type==='other'){
      cur=null;
      if(isExplicitTeam(item.line)){
        // Always create explicit teams even if empty
        const m=item.line.match(/^eq\w*\s+(.+)$/i);
        const rawName=m?'Equipo '+m[1]:item.line;
        teamNum++;
        cur={name:rawName,color:'b',side:'',players:[],_explicit:true};
        res.push(cur);
      } else {
        // Non-explicit: only use as team name if next item is a player
        let nextIsPlayer=false;
        for(let j=i+1;j<cleaned.length;j++){
          if(cleaned[j].type==='player'){ nextIsPlayer=true; break; }
          if(cleaned[j].type==='vs'||cleaned[j].type==='other') break;
        }
        if(nextIsPlayer){
          teamNum++;
          cur={name:item.line,color:'b',side:'',players:[]};
          res.push(cur);
        }
        // else: ignore (location, field name, etc.)
      }
    }
  }

  // Keep explicit teams even if empty, remove non-explicit empty ones
  return res.filter(t=>t.players.length>0||t._explicit);
}

function propagateOpposites(changedTi, prop, val){
  // Only set direct rival to opposite — no cascade to other matches
  const pairs=session().customMatches||buildMatches(teams().length);
  const opp=prop==='color'?(val==='w'?'b':'w'):(val==='L'?'R':'L');
  pairs.forEach(pair=>{
    if(pair[0]===changedTi && teams()[pair[1]]) teams()[pair[1]][prop]=opp;
    if(pair[1]===changedTi && teams()[pair[0]]) teams()[pair[0]][prop]=opp;
  });
}

function buildMatches(n){
  const m=[];
  // Default: 0vs2, 1vs3 (so team order in list = same field, rivals across)
  // If 4 teams: 0vs2, 1vs3. If 2: 0vs1. If 3: 0vs1, 2 alone
  if(n===2){ m.push([0,1]); }
  else if(n===3){ m.push([0,1]); m.push([0,2]); } // triangular
  else { for(let i=0;i<Math.floor(n/2);i++) m.push([i,i+Math.floor(n/2)]); }
  return m;
}
function uid(){ return 'p'+Math.random().toString(36).slice(2,9); }
function cap(s){ return s?s.charAt(0).toUpperCase()+s.slice(1):'';}

// ── GOTO SETUP ──
// Day name to day-of-week index (0=Sun)
const DAY_MAP={
  'lunes':1,'martes':2,'miércoles':3,'miercoles':3,'jueves':4,
  'viernes':5,'sábado':6,'sabado':6,'domingo':0
};

function applyDetectedLabel(){
  const infoDiv=document.getElementById('detected-info');
  if(!infoDiv||!infoDiv._detected) return;
  const d=infoDiv._detected;
  session().label=d.label;
  if(d.createdDate) session().createdDate=d.createdDate;
  if(d.savedAt) session().savedAt=d.savedAt;
  save(); renderTabs();
}
function createMultipleSessions(){
  openModal('HORARIOS','','Un horario por línea, ej:\nLunes 18:00\nMartes 19:00\nMiércoles 20:00',text=>{
    if(!text||!text.trim()) return;
    const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
    const now=new Date();
    let created=0;
    lines.forEach(line=>{
      const parsed=parseLabelDate(line,now);
      const fullLabel=labelWithDay(line,parsed.dateObj);
      const ses=newSession(fullLabel);
      ses.createdDate=parsed.dateLabel;
      ses.savedAt=parsed.dateObj.toISOString();
      sessions.push(ses);
      created++;
    });
    if(created>0){
      sortSessionsByTime();
      curIdx=sessions.findIndex(s=>!s.closed)&&0;
      save();renderTabs();showScreen('home');
    }
  });
}

function detectSessionInfo(text){
  const infoDiv=document.getElementById('detected-info');
  if(!infoDiv||!text) return;
  // Look for day + time pattern: *SÁBADO 18:45* or SÁBADO 18:45 or just 18:45
  const dayTimeMatch=text.match(/(?:\*)?([a-záéíóúüñ]+)\s+(\d{1,2}:\d{2})(?:\*)?/i);
  const timeOnlyMatch=text.match(/(\d{1,2}:\d{2})/);

  if(dayTimeMatch){
    const dayName=dayTimeMatch[1].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const time=dayTimeMatch[2];
    const dayIdx=DAY_MAP[dayName]||DAY_MAP[dayTimeMatch[1].toLowerCase()];

    if(dayIdx!==undefined){
      // Find next occurrence of that day
      const now=new Date();
      const todayIdx=now.getDay();
      let daysAhead=dayIdx-todayIdx;
      if(daysAhead<0) daysAhead+=7;
      if(daysAhead===0) daysAhead=7; // next week if same day
      const target=new Date(now);
      target.setDate(now.getDate()+daysAhead);
      const dateLabel=target.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
      const fullLabel=dayTimeMatch[1].charAt(0).toUpperCase()+dayTimeMatch[1].slice(1)+' '+time;
    infoDiv.style.display='block';
  infoDiv.innerHTML='📅 Detectado: <b>'+labelStr+'</b> ('+dayPart+')';
  infoDiv._detected={label:labelStr, createdDate:parsed.dateLabel, savedAt:parsed.dateObj.toISOString()};
  applyDetectedLabel();
    }
  }
  infoDiv.style.display='none';
  infoDiv._detected=null;
}

      const b=document.createElement('button');

      b.onclick=()=>{teams()[ti].color=col;save();renderSetup();};
      ctrl.appendChild(b);
    });
    // side
    ['L','R'].forEach(side=>{
      const b=document.createElement('button');

      b.onclick=()=>{
        const newSide=team.side===side?'':side;
        teams()[ti].side=newSide;
        // side is manual — no auto-propagation
        save(); renderSetup();
      };
      ctrl.appendChild(b);
    });
    head.appendChild(nm); head.appendChild(ctrl); card.appendChild(head);
    // chips
    const chips = document.createElement('div'); chips.className='setup-chips';
    chips.style.background=team.color==='w'?'#f5f5f5':'#0d1117';

        ch.style.cssText=team.color==='w'?'background:#e0e0e0;border:1px solid #ccc;color:#333;':'background:#161b22;border:1px solid #30363d;color:#ccc;';
        ch.textContent=cap(p.name)||'Plaza libre';chips.appendChild(ch);
      });

  });

  // ── Matchup builder (only if >2 teams) ──
  const sec = document.getElementById('matchup-section');

  if(teams().length > 2){
    sec.style.display='block';
    mb.innerHTML='';
    if(!session().customMatches){
      session().customMatches = buildMatches(teams().length);
      // Auto-set IZQ/DER based on matchup
      session().customMatches.forEach(pair=>{
        if(!teams()[pair[0]].side) teams()[pair[0]].side='L';
        if(!teams()[pair[1]].side) teams()[pair[1]].side='R';
      });
    }
    renderMatchupBuilder(mb);

function renderMatchupBuilder(container){
  container.innerHTML='';
  const cms = session().customMatches || [];
  cms.forEach((pair,pi)=>{
    const row = document.createElement('div'); row.className='mu-pair';
    const selA = makeTeamSelect(pair[0], pi, 0);
    const vs   = document.createElement('div'); vs.className='mu-vs'; vs.textContent='VS';
    const selB = makeTeamSelect(pair[1], pi, 1);
    const rm   = document.createElement('button'); rm.className='mu-remove'; rm.textContent='X';
    rm.onclick=()=>{
      session().customMatches.splice(pi,1);
      save(); renderSetup();
    };
    row.appendChild(selA); row.appendChild(vs); row.appendChild(selB);
    if(cms.length>1) row.appendChild(rm);
    container.appendChild(row);
  });
  // Allow triangular: show add button if teams remain AND we have fewer matches than teams-1
  const maxMatches=teams().length>=3?teams().length-1:1;
  if(cms.length < maxMatches){
    const add = document.createElement('button'); add.className='mu-add';
    add.textContent='+ AÑADIR PARTIDO';
    add.onclick=()=>{
      // Pick two teams that can still play (teams can repeat in triangular)
      const t0=0, t1=cms.length<teams().length?cms.length:1;
      session().customMatches.push([t0,t1]);
      save(); renderSetup();
    };
    container.appendChild(add);
  }
}

function makeTeamSelect(selectedIdx, pairIdx, side){
  const sel = document.createElement('select'); sel.className='mu-select';
  teams().forEach((t,ti)=>{
    const opt=document.createElement('option');
    opt.value=ti; opt.textContent=t.name;
    if(ti===selectedIdx) opt.selected=true;
    sel.appendChild(opt);
  });
  sel.onchange=()=>{
    session().customMatches[pairIdx][side]=parseInt(sel.value);
    save();
  };
  return sel;
}

function renderMatch(){

    if(iA>=teams().length||iB>=teams().length) return;
    const tA=teams()[iA], tB=teams()[iB];

    const sideA=tA.side||'L';

    sep.innerHTML='<div style="font-size:10px;color:#94a3b8;font-family:Barlow,sans-serif;letter-spacing:2px;margin-bottom:3px;">PARTIDO '+(mi+1)+'</div>'

    mt.textContent=tA.name.toUpperCase()+' VS '+tB.name.toUpperCase();

  const curSt = st()[player.id]||0;

  row.className='p-row s'+(curSt===4?'hot':curSt===3?'free':curSt)+(s.isWhite?' wt':'');

  // ── Info bar (long press to revert) ──

// ── ACTIONS ──
function setState(pid,ti,newSt,playerName){
  if(newSt===2){
    window._confirmHotCb=()=>{ st()[pid]=4; refreshAndSort(ti); }; // 4 = hot price
    openConfirm(
      '¿CONFIRMAR PAGO?',
      (playerName||'Este jugador'),
      ()=>{ st()[pid]=2; refreshAndSort(ti); },
      ()=>{ st()[pid]=3; refreshAndSort(ti); }
    );
  } else {
    st()[pid]=newSt;
    refreshAndSort(ti);
  }
}
function revertToAbsent(pid,ti,playerName,curSt){
  if(curSt===0) return;
  const label=curSt===4?'🔥':curSt===3?'GRATIS':curSt===2?'PAGADO':'PRESENTE';
  if(curSt===2){
    // Was paid — needs confirmation
    openConfirm(
      '¿QUITAR PAGADO?',
      (playerName||'Este jugador')+' volverá a AUSENTE.',
      ()=>{ st()[pid]=0; refreshAndSort(ti); }
    );
  } else {
    // Was present — instant, no confirm
    st()[pid]=0;
    refreshAndSort(ti);
  }
}
function deletePlayer(pid,ti,playerName){
  openConfirm(
    '¿ELIMINAR JUGADOR?',
    'Se eliminará '+(playerName||'este jugador')+' de la lista.',
    ()=>{
      teams()[ti].players=teams()[ti].players.filter(p=>p.id!==pid);
      delete st()[pid];
      refreshAndSort(ti);updateGlobal();updateSummary();save();
    }
  );
}
function refreshAndSort(ti){
  teams()[ti].players.sort((a,b)=>(a.name||'').localeCompare(b.name||'','es',{sensitivity:'base'}));
  refreshTeamBlock(ti);updateGlobal();updateSummary();save();
}
function markAllPaid(ti,val){
  if(val){
    openConfirm(
      '¿MARCAR TODOS?',
      teams()[ti].name+' — '+teams()[ti].players.length+' jugadores.',
      ()=>{
        teams()[ti].players.forEach(p=>{st()[p.id]=2;});
        refreshAndSort(ti);
      },
      ()=>{
        teams()[ti].players.forEach(p=>{st()[p.id]=3;});
        refreshAndSort(ti);
      }
    );
    window._confirmHotCb=()=>{
      teams()[ti].players.forEach(p=>{st()[p.id]=4;});
      refreshAndSort(ti);
    };
  } else {
    teams()[ti].players.forEach(p=>{st()[p.id]=0;});
    refreshAndSort(ti);
  }
}
function promptAdd(ti){
  openModal('NUEVO JUGADOR','','Nombre (deja vacío para plaza libre)',name=>{
    const id=uid();
    teams()[ti].players.push({id, name:name.trim()});
    st()[id]=0;
    refreshTeamBlock(ti);updateGlobal();updateSummary();save();
    // scroll to that team block
    const el=document.getElementById('tblock-'+ti);
    if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
}
function promptEdit(pid,ti,current){
  openModal('EDITAR NOMBRE',current,'',name=>{
    const p=teams()[ti].players.find(x=>x.id===pid);
    if(p) p.name=name.trim();
    refreshTeamBlock(ti);save();
  });
}
function movePlayer(pid,fromTi,toTi){
  const fi=teams()[fromTi].players.findIndex(p=>p.id===pid);
  if(fi===-1)return;
  const [p]=teams()[fromTi].players.splice(fi,1);
  teams()[toTi].players.push(p);
  // Keep existing state — don't delete
  refreshTeamBlock(fromTi);
  refreshTeamBlock(toTi);
  updateGlobal();updateSummary();save();
}

function refreshTeamBlock(ti){
  const existing=document.getElementById('tblock-'+ti);
  if(!existing)return;
  const s=tsty(teams()[ti]);
  const newBlock=buildTeamBlock(ti);
  existing.parentNode.replaceChild(newBlock,existing);
}

function countSt(ti,s){ return teams()[ti].players.filter(p=>st()[p.id]===s).length; }
let revenueVisible=false;
function toggleRevenue(){
  revenueVisible=!revenueVisible;
  const bar=document.getElementById('revenue-bar');
  const eye=document.getElementById('revenue-eye');
  if(bar) bar.style.display=revenueVisible?'flex':'none';
  if(eye) eye.textContent=revenueVisible?'🙈':'👁';
}
function updateGlobal(){
  const all=teams().flatMap(t=>t.players);
  let extraPaid=0, extraFree=0, extraTotal=0;
  teams().forEach((t,ti)=>{
    if((t.rivalCount||0)>0){
      // Empty rival team
      if(t.players.length===0){
        extraTotal+=t.rivalCount;
        const ts=st()['__team_'+ti];
        if(ts==='paid'||ts===true) extraPaid+=t.rivalCount;
        else if(ts==='free') extraFree+=t.rivalCount;
      } else {
        // Mixed: has some manual players + remaining count
        const remCount=t.rivalCount - t.players.length;
        if(remCount>0){
          extraTotal+=remCount;
          const tr=st()['__rival_rem_'+ti];
          if(tr==='paid') extraPaid+=remCount;
          else if(tr==='free') extraFree+=remCount;
        }
      }
    }
  });
  const total=all.length+extraTotal;
  const paid=all.filter(p=>st()[p.id]===2||st()[p.id]===4).length+extraPaid;
  const free=all.filter(p=>st()[p.id]===3).length+extraFree;
  const hot=all.filter(p=>st()[p.id]===4).length;
  const pres=all.filter(p=>st()[p.id]===1).length;
  const abs=total-paid-free-pres;
  document.getElementById('g-paid').textContent=paid;
  const gf=document.getElementById('g-free');if(gf)gf.textContent=free;
  document.getElementById('g-abs').textContent=abs;
  document.getElementById('g-total').textContent=total;
  // Revenue
  const base=session().priceBase||5;
  const paidBase=all.filter(p=>st()[p.id]===2).length+extraPaid;
  const paidHot=all.filter(p=>st()[p.id]===4).length;
  const revenue=paidBase*base+paidHot*(session().priceHot||3);
  const rb=document.getElementById('revenue-bar');
  const rt=document.getElementById('revenue-total');
  if(rb&&rt){
    if(revenueVisible) rb.style.display='flex';
    rt.textContent=revenue.toFixed(revenue%1?1:0)+'€';
  }
}
function updateSummary(){
  const bar=document.getElementById('summary-bar');
  const pres=teams().flatMap(t=>t.players).filter(p=>st()[p.id]===1);
  const absentPlayers=teams().flatMap(t=>t.players).filter(p=>!st()[p.id]);
  // Rival teams unpaid
  const rivalPending=[];
  teams().forEach((t,ti)=>{
    if(t.players.length===0){
      const n=t.rivalCount||0;
      const paid=st()['__team_'+ti];
      if(!paid){
        if(n>0) rivalPending.push({name:t.name,count:n});
        else rivalPending.push({name:t.name,count:'?'}); // named team, count unknown
      }
    }
  });
  if(!pres.length && !absentPlayers.length && !rivalPending.length){bar.style.display='none';return;}
  bar.style.display='block';bar.innerHTML='';
  // Title
  const mainTitle=document.createElement('div');
  mainTitle.style.cssText='font-size:11px;color:#ef5350;font-family:Barlow,sans-serif;letter-spacing:1px;font-weight:700;margin-bottom:8px;';
  mainTitle.textContent='⚠ PENDIENTES DE COBRO — pulsa para ir al jugador';
  bar.appendChild(mainTitle);
  // All unpaid (absent + present) grouped by team
  if(pres.length || absentPlayers.length){
    teams().forEach((t,ti)=>{
      const unpaid=t.players.filter(p=>{const s=st()[p.id]||0;return s<2;});
      if(!unpaid.length) return;
      const teamLabel=document.createElement('div');
      teamLabel.style.cssText='font-size:9px;color:#8b949e;font-family:Barlow,sans-serif;letter-spacing:1px;margin:6px 0 3px;';
      teamLabel.textContent=t.name.toUpperCase();
      bar.appendChild(teamLabel);
      const names=document.createElement('div');names.className='sum-names';
      unpaid.forEach(p=>{
        const s=st()[p.id]||0;
        const ch=document.createElement('div');ch.className='sum-chip';
        ch.style.cssText='background:'+(s===1?'#1565c030':'#ffffff10')+';border:1px solid '+(s===1?'#4fc3f7':'#444')+';color:'+(s===1?'#e0f0ff':'#aaa')+';font-weight:600;cursor:pointer;';
        ch.textContent=(p.name?cap(p.name):'Plaza')+(s===1?' ✋':' ⏳');
        ch.onclick=()=>{
          const el=document.getElementById('prow-'+p.id);
          if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
        };
        names.appendChild(ch);
      });
      bar.appendChild(names);
    });
  }
  if(rivalPending.length){
    const rTitle=document.createElement('div');
    rTitle.style.cssText='font-size:9px;color:#ffb74d;font-family:Barlow,sans-serif;letter-spacing:1px;margin-top:8px;margin-bottom:4px;';
    rTitle.textContent='EQUIPOS SIN COBRAR';
    bar.appendChild(rTitle);

    rivalPending.forEach(r=>{
      const ch=document.createElement('div');ch.className='sum-chip';

      ch.textContent=r.name+' ('+r.count+' ⏳)';
      // Find team index and scroll to it
      const rTi=teams().findIndex(t=>t.name===r.name);
      if(rTi>=0){
        ch.style.cursor='pointer';
        ch.onclick=()=>{
          const el=document.getElementById('tblock-'+rTi);
          if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
        };
      }
      rNames.appendChild(ch);
    });
    bar.appendChild(rNames);
  }
}

// ── SHUFFLE ──
function shufflePlayers(){
  const ts=teams();
  if(!ts.length) return;
  const sizes=ts.map(t=>t.players.length);
  const all=ts.flatMap(t=>t.players);
  // Fisher-Yates shuffle
  for(let i=all.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [all[i],all[j]]=[all[j],all[i]];
  }
  let idx=0;
  ts.forEach((t,i)=>{ t.players=all.slice(idx,idx+sizes[i]); idx+=sizes[i]; });
  // reset states
  session().state={};
  save();
  renderSetup();
}

  const commentLine=d.comment?('<div style="font-size:10px;color:#8b949e;font-family:Barlow,sans-serif;margin-top:2px;">💬 '+d.comment+'</div>'):'';
  info.innerHTML='<div style="font-size:14px;font-weight:700;color:'+(d.paid?'#16a34a':'#dc2626')+';">'+cap(d.name)+(d.manual?' <span style="font-size:9px;background:#fef3c7;color:#92400e;padding:1px 4px;border-radius:3px;">MANUAL</span>':'')+' </div>'
    +'<div style="font-size:11px;color:#64748b;font-family:Barlow,sans-serif;">'+d.session+' · '+d.date+paidInfo+'</div>'+commentLine;
  const btn=document.createElement('button');
  btn.style.cssText='padding:5px 12px;border-radius:6px;border:1.5px solid '+(d.paid?'#30363d':'#66bb6a55')+';color:'+(d.paid?'#555':'#66bb6a')+';font-size:11px;font-family:Barlow,sans-serif;background:none;cursor:pointer;';
  btn.textContent=d.paid?'💬 COMENTARIO':'MARCAR PAGADO';
  btn.onclick=()=>{
    if(d.paid){
      // Add comment
      openModal('COMENTARIO','',d.comment||'',comment=>{
        const debts=loadDebts();
        const idx=debts.findIndex(x=>x.id===d.id);
        if(idx>-1){ debts[idx].comment=comment; saveDebts(debts); renderDebts(); }
      });
    } else {
      openConfirm('MARCAR PAGADA','Deuda de '+cap(d.name)+' — marcar como pagada?',
        ()=>{
          const debts=loadDebts();
          const idx=debts.findIndex(x=>x.id===d.id);
          if(idx>-1){
            debts[idx].paid=true;
            debts[idx].paidDate=new Date().toLocaleDateString('es-ES');
            saveDebts(debts); renderDebts();
          }
        }
      );
    }
  };
  const delBtn=document.createElement('button');
  delBtn.style.cssText='width:26px;height:26px;border-radius:5px;border:1.5px solid #333;color:#555;font-size:11px;background:none;cursor:pointer;';
  delBtn.textContent='✕';
  delBtn.onclick=()=>{
    openConfirm(
      "ELIMINAR DEUDA",
      "Eliminar deuda de "+cap(d.name)+"?",
      ()=>{
        const debts=loadDebts();
        saveDebts(debts.filter(x=>x.id!==d.id));
        renderDebts();
      }
    );
  };
  row.appendChild(info);row.appendChild(btn);row.appendChild(delBtn);
  return row;
}

// ── HOME / HISTORY ──
function renderHome(){
  const activeList=document.getElementById('home-active-list');
  const closedList=document.getElementById('home-closed-list');
  const closedSection=document.getElementById('home-closed-section');
  if(!activeList) return;
  activeList.innerHTML=''; closedList.innerHTML='';

  const active=sessions.map((ses,i)=>({ses,i})).filter(({ses})=>!ses.closed);
  const closed=sessions.map((ses,i)=>({ses,i})).filter(({ses})=>!!ses.closed);

  // Active sessions
  if(!active.length){
    activeList.innerHTML='<div style="color:#94a3b8;font-family:Barlow,sans-serif;font-size:13px;text-align:center;padding:12px 0;">Sin partidos activos</div>';
  } else {
    // Group active by creation date
    const aByDate={};const aDateOrder=[];
    active.forEach(({ses,i})=>{
      const d=ses.createdDate||
        (ses.savedAt?new Date(ses.savedAt).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'Hoy');
      if(!aByDate[d]){aByDate[d]=[];aDateOrder.push(d);}
      aByDate[d].push({ses,i});
    });
    aDateOrder.sort((a,b)=>{
      const da=active.find(({ses})=>(ses.createdDate||'')===a);
      const db=active.find(({ses})=>(ses.createdDate||'')===b);
      const ta=da?new Date(da.ses.savedAt||0):new Date(0);
      const tb=db?new Date(db.ses.savedAt||0):new Date(0);
      return tb-ta;
    });
    aDateOrder.forEach(date=>{
      const dateEl=document.createElement('div');
      dateEl.style.cssText='font-size:10px;color:#1565c0;font-family:Barlow,sans-serif;letter-spacing:1px;text-transform:uppercase;margin:8px 0 5px;font-weight:700;';
      dateEl.textContent=date;
      activeList.appendChild(dateEl);
      aByDate[date].forEach(({ses,i})=>activeList.appendChild(makeSessionCard(ses,i,false)));
    });
  }

  // Closed sessions grouped by date
  if(!closed.length){
    closedSection.style.display='none';
  } else {
    closedSection.style.display='block';
    const byDate={};const byDateOrder=[];
    closed.forEach(({ses,i})=>{
      // Group by CREATION date (the day the match was for), not close date
      const d=ses.createdDate||
        (ses.savedAt?new Date(ses.savedAt).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'Sin fecha');
      if(!byDate[d]){byDate[d]=[];byDateOrder.push(d);}
      byDate[d].push({ses,i});
    });
    // Sort dates newest first
    byDateOrder.sort((a,b)=>{
      const da=closed.find(({ses})=>(ses.createdDate||'')===a);
      const db=closed.find(({ses})=>(ses.createdDate||'')===b);
      const ta=da?new Date(da.ses.savedAt||0):new Date(0);
      const tb=db?new Date(db.ses.savedAt||0):new Date(0);
      return tb-ta;
    });
    byDateOrder.forEach(date=>{
      const dateEl=document.createElement('div');
      dateEl.style.cssText='font-size:10px;color:#94a3b8;font-family:Barlow,sans-serif;letter-spacing:1px;text-transform:uppercase;margin:8px 0 5px;';
      dateEl.textContent=date;
      closedList.appendChild(dateEl);
      byDate[date].forEach(({ses,i})=>closedList.appendChild(makeSessionCard(ses,i,true)));
    });
  }
}

function makeSessionCard(ses,i,isClosed){
  if(!ses) return document.createElement('div');
  const all=ses.teams?ses.teams.flatMap(t=>t.players):[];
  let paid=all.filter(p=>{const s=(ses.state&&ses.state[p.id])||0;return s===2||s===3||s===4;}).length;
  let total=all.length;
  // Add rival team counts
  if(ses.teams&&ses.state){
    ses.teams.forEach((t,ti)=>{
      if((t.rivalCount||0)>0){
        if(t.players.length===0){
          total+=t.rivalCount;
          if(ses.state['__team_'+ti]) paid+=t.rivalCount;
        } else {
          const rem=(t.rivalCount||0)-t.players.length;
          if(rem>0){
            total+=rem;
            if(ses.state['__rival_rem_'+ti]) paid+=rem;
          }
        }
      }
    });
  }

  const card=document.createElement('div');
  card.style.cssText='background:#fff;border:1.5px solid '+(isClosed?'#e0e4ea':'#93c5fd')+';border-radius:10px;padding:10px 12px;margin-bottom:7px;position:relative;';

  const row=document.createElement('div');
  row.style.cssText='display:flex;align-items:center;gap:8px;cursor:pointer;';
  row.onclick=()=>{curIdx=i;renderTabs();switchSession(i);};

  const info=document.createElement('div');info.style.cssText='flex:1;min-width:0;';
  const closedDate=isClosed&&ses.closedAt?new Date(ses.closedAt).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'';
  info.innerHTML='<div style="font-size:15px;font-weight:800;color:'+(isClosed?'#94a3b8':'#1e293b')+';font-family:Barlow Condensed,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+ses.label
    +(isClosed?' <span style="font-size:9px;background:#f1f5f9;color:#94a3b8;padding:1px 5px;border-radius:4px;">CERRADO'+(closedDate?' '+closedDate:'')+'</span>'
             :' <span style="font-size:9px;background:#dbeafe;color:#1565c0;padding:1px 5px;border-radius:4px;">ACTIVO</span>')+'</div>'
    +'<div style="font-size:10px;color:#94a3b8;font-family:Barlow,sans-serif;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'
    +(ses.teams?ses.teams.map(t=>t.name).join(' · '):'Sin equipos')+'</div>';

  const statsDiv=document.createElement('div');
  statsDiv.style.cssText='text-align:right;flex-shrink:0;';
  const revHtml=homeRevVisible&&ses.revenue!=null
    ?'<div style="font-size:12px;font-weight:800;color:#66bb6a;">'+ses.revenue.toFixed(0)+'€</div>':'<div style="font-size:12px;color:#e0e4ea;">—</div>';
  statsDiv.innerHTML='<div style="font-size:15px;font-weight:800;color:'+(paid===total&&total>0?'#66bb6a':'#1e293b')+';font-family:Barlow Condensed,sans-serif;">'+paid+'/'+total+'</div>'
    +'<div style="font-size:9px;color:#94a3b8;font-family:Barlow,sans-serif;">pagados</div>'+revHtml;

  row.appendChild(info);row.appendChild(statsDiv);
  card.appendChild(row);

  if(isClosed&&selectMode){
    // Checkbox mode
    const cb=document.createElement('input');
    cb.type='checkbox';cb.checked=selectedClosed.has(i);
    cb.style.cssText='position:absolute;top:10px;right:10px;width:18px;height:18px;cursor:pointer;accent-color:#ef4444;';
    cb.onclick=(e)=>{e.stopPropagation();if(cb.checked)selectedClosed.add(i);else selectedClosed.delete(i);};
    card.appendChild(cb);
    card.style.cursor='pointer';
    card.onclick=(e)=>{if(e.target!==cb){cb.checked=!cb.checked;if(cb.checked)selectedClosed.add(i);else selectedClosed.delete(i);}};
  } else {
    const delBtn=document.createElement('button');
    delBtn.style.cssText='position:absolute;top:6px;right:6px;background:none;border:none;color:#e2e8f0;font-size:11px;cursor:pointer;padding:3px 6px;line-height:1;';
    delBtn.textContent='✕';
    delBtn.onclick=(e)=>{e.stopPropagation();deleteSessionFromHome(i);};
    card.appendChild(delBtn);
  }
  return card;
}

// ── BACKUP ──
function exportBackup(){
  const data={
    sessions: sessions,
    debts: loadDebts(),
    exportedAt: new Date().toISOString(),
    version: 'cryssports-v61'
  };
  const json=JSON.stringify(data, null, 2);
  const date=new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}).replace(/\//g,'-');
  const filename='cryssports-backup-'+date+'.json';
  // Try download, fallback to new tab
  try {
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.download=filename; a.href=url;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },1000);
  } catch(e) {
    // Fallback: open in new tab
    const win=window.open('','_blank');
    win.document.write('<pre>'+json+'</pre>');
    win.document.title=filename;
  }
}

function importBackup(){
  const input=document.createElement('input');
  input.type='file'; input.accept='.json,.txt';
  document.body.appendChild(input);
  input.onchange=(e)=>{
    const file=e.target.files[0];
    if(!file){ document.body.removeChild(input); return; }
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(data.sessions&&Array.isArray(data.sessions)){
          openConfirm('RESTAURAR COPIA','Se importarán '+data.sessions.length+' partidos. Los datos actuales se conservan.',()=>{
            // Merge: add imported sessions that don't already exist
            data.sessions.forEach(s=>{ if(!sessions.find(x=>x.id===s.id)) sessions.push(s); });
            if(data.debts){ const existing=loadDebts(); const merged=[...existing,...data.debts.filter(d=>!existing.find(e=>e.id===d.id))]; saveDebts(merged); }
            sortSessionsByTime(); save(); renderTabs(); showScreen('home');
          });
        } else { alert('Archivo no válido — no contiene datos de partidos'); }
      }catch(e){ alert('Error al leer el archivo: '+e.message); }
      document.body.removeChild(input);
    };
    reader.readAsText(file);
  };
  input.click();
}

// ── INIT ──
function init(){
  const loaded = loadAll();
  if(!loaded || !sessions.length){
    sessions=[newSession(fmtNow())];
    curIdx=0;
  }
  sortSessionsByTime();
  renderTabs();
  const ses=session();
  if(ses.screen==='match'){ renderMatch(); showScreen('match'); }
  else if(ses.screen==='setup'){ renderSetup(); showScreen('setup'); }
  else {
    if(ses.rawList) document.getElementById('lista').value=ses.rawList;
    showScreen('input');
  }
}

init();
</script>
